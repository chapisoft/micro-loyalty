name: 🚀 Micro-Loyalty Continuous Integration (CI)

on:
  push:
    branches: [ main, master, develop, 'feature/**', 'release/**' ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8694821173:AAFJ3XlvDpYRywzEiB54RSNjAdS62XPKZXA' }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '-5397937309' }}

jobs:
  backend-test:
    name: ☕ Backend Test & Quality Gate (Java 17)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🧪 Run Backend Unit & Integration Tests (Reactor All 15 Modules)
        run: |
          mvn clean test -B

  frontend-build:
    name: 🖥️ Frontend Build Verification (CMS & Webview)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            src/cms/package-lock.json
            src/webview/package-lock.json

      - name: 🏗️ Build Loyalty CMS
        run: |
          cd src/cms
          npm ci
          npm run build

      - name: 🏗️ Build Loyalty Webview & GameHub
        run: |
          cd src/webview
          npm ci
          npm run build

  notify:
    name: 📢 Telegram Notification
    needs: [ backend-test, frontend-build ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📨 Send Telegram Build Status
        run: |
          STATUS="SUCCESS"
          EMOJI="✅"
          if [ "${{ needs.backend-test.result }}" != "success" ] || [ "${{ needs.frontend-build.result }}" != "success" ]; then
            STATUS="FAILED"
            EMOJI="❌"
          fi

          MESSAGE="<b>${EMOJI} [GITHUB-ACTIONS-CI] Micro-Loyalty Build Report</b>%0A"
          MESSAGE="${MESSAGE}<b>• Trạng thái:</b> ${STATUS}%0A"
          MESSAGE="${MESSAGE}<b>• Nhánh (Branch):</b> <code>${{ github.ref_name }}</code>%0A"
          MESSAGE="${MESSAGE}<b>• Mã Commit:</b> <code>${{ github.sha }}</code>%0A"
          MESSAGE="${MESSAGE}<b>• Tác giả:</b> ${{ github.actor }}%0A"
          MESSAGE="${MESSAGE}<b>• Backend Tests:</b> ${{ needs.backend-test.result }}%0A"
          MESSAGE="${MESSAGE}<b>• Frontend Build:</b> ${{ needs.frontend-build.result }}%0A"
          MESSAGE="${MESSAGE}<b>• Xem chi tiết:</b> <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">GitHub Action Logs</a>"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="HTML" || echo "Gửi Telegram thất bại"

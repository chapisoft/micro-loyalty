# ==============================================================================
# Host Nginx Virtual Host Configuration — Hệ Sinh Thái Khách Hàng Thân Thiết & GameHub
# Domains: api.mid.io.vn, docs.mid.io.vn, cms.mid.io.vn, portal.mid.io.vn
# Upstream: http://172.18.0.1:18095 (Loyalty SaaS Gateway)
# ==============================================================================

# ── 1. Backend RESTful API Gateway & Actuator (api.mid.io.vn) ────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.mid.io.vn;

    access_log /var/log/nginx/loyalty_api_access.log;
    error_log /var/log/nginx/loyalty_api_error.log;

    client_max_body_size 50M;

    # Điểm cuối Actuator & Health Check
    location /actuator/ {
        proxy_pass http://172.18.0.1:18095/loyalty/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://172.18.0.1:18095/loyalty/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # API Nghiệp Vụ v1 / v2 / v3
    location /loyalty/ {
        proxy_pass http://172.18.0.1:18095/loyalty/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location / {
        proxy_pass http://172.18.0.1:18095/loyalty/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

# ── 2. OpenAPI 3 Specification & Swagger Docs (docs.mid.io.vn) ───────────────
server {
    listen 80;
    listen [::]:80;
    server_name docs.mid.io.vn;

    access_log /var/log/nginx/loyalty_docs_access.log;
    error_log /var/log/nginx/loyalty_docs_error.log;

    client_max_body_size 20M;

    # Chuyển hướng trang gốc đến Swagger UI
    location = / {
        return 301 /swagger-ui/index.html;
    }

    location /swagger-ui/ {
        proxy_pass http://172.18.0.1:18095/loyalty/swagger-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass http://172.18.0.1:18095/loyalty/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://172.18.0.1:18095/loyalty/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── 3. Cổng Quản Trị Trung Tâm Loyalty CMS (cms.mid.io.vn) ───────────────────
server {
    listen 80;
    listen [::]:80;
    server_name cms.mid.io.vn;

    access_log /var/log/nginx/loyalty_cms_access.log;
    error_log /var/log/nginx/loyalty_cms_error.log;

    client_max_body_size 50M;

    # API Proxy cho CMS gọi trực tiếp Backend cùng domain
    location /auth/ {
        proxy_pass http://172.18.0.1:18095/loyalty/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /users/ {
        proxy_pass http://172.18.0.1:18095/loyalty/users/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /loyalty/ {
        proxy_pass http://172.18.0.1:18095/loyalty/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://172.18.0.1:18095/loyalty/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://172.18.0.1:18095/loyalty/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Giao diện CMS SPA tĩnh
    location / {
        proxy_pass http://172.18.0.1:18095/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

# ── 4. Cổng Khách Hàng Thân Thiết & GameHub Webview (portal.mid.io.vn) ───────

# ==============================================================================
# CẤU HÌNH NGINX GATEWAY — MÔ HÌNH SAAS MULTI-TENANT (MICRO-LOYALTY)
# Vị trí: deploy/micro-loyalty/config/nginx/nginx-saas.conf
# ==============================================================================

upstream loyalty_backend {
    server loyalty-service:8085;
    keepalive 64;
}

upstream loyalty_cms_upstream {
    server loyalty-cms:80;
    keepalive 32;
}

upstream loyalty_webview_upstream {
    server loyalty-webview:80;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # 1. API Reverse Proxy đến Loyalty Service
    location /loyalty/ {
        proxy_pass http://loyalty_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 2. Cổng Webview & Game H5 Decoupled
    location /gamehub/ {
        proxy_pass http://loyalty_webview_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Cổng Quản Trị Trung Tâm CMS
    location / {
        proxy_pass http://loyalty_cms_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

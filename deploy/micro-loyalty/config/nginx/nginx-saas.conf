# ==============================================================================
# CẤU HÌNH NGINX GATEWAY — MÔ HÌNH SAAS MULTI-TENANT (MICRO-LOYALTY)
# Vị trí: deploy/micro-loyalty/config/nginx/nginx-saas.conf
# ==============================================================================

# Phân giải DNS nội bộ Docker (127.0.0.11) động mỗi 5s để tự động cập nhật IP container khi Rolling Update
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;

# Định tuyến API tự động về đúng Microservice theo tiền tố đường dẫn (ưu tiên khớp dài trước)
map $uri $loyalty_api_upstream {
    default "cms-service:8081";

    # Game-Service (Cổng 8083)
    ~^/(loyalty-service/)?gamehub/v1(/|$)                       "game-service:8083";
    ~^/(loyalty-service/)?loyalty/v1/luckydraw(/|$)             "game-service:8083";
    ~^/(loyalty-service/)?loyalty/v1/admin/learning(/|$)        "game-service:8083";
    ~^/(loyalty-service/)?loyalty/v1/admin/games(/|$)           "game-service:8083";

    # Partner-Service (Cổng 8085)
    ~^/(loyalty-service/)?loyalty/v1/admin/dead-letter(/|$)     "partner-service:8085";
    ~^/(loyalty-service/)?loyalty/v1/partners/locations(/|$)    "partner-service:8085";
    ~^/(loyalty-service/)?loyalty/v1/payment-points(/|$)        "partner-service:8085";
    ~^/(loyalty-service/)?loyalty/v1/partner-portal(/|$)        "partner-service:8085";
    ~^/(loyalty-service/)?loyalty/v1/partner(/|$)               "partner-service:8085";
    ~^/(loyalty-service/)?loyalty/v1/clearinghouse(/|$)         "partner-service:8085";

    # Campaign-Service (Cổng 8084)
    ~^/(loyalty-service/)?loyalty/v1/segments(/|$)              "campaign-service:8084";
    ~^/(loyalty-service/)?loyalty/v1/engagement(/|$)            "campaign-service:8084";
    ~^/(loyalty-service/)?loyalty/v1/milestones(/|$)            "campaign-service:8084";
    ~^/(loyalty-service/)?loyalty/v1/campaigns(/|$)             "campaign-service:8084";
    ~^/(loyalty-service/)?loyalty/v1/referrals(/|$)             "campaign-service:8084";
    ~^/(loyalty-service/)?loyalty/v1/budgets(/|$)               "campaign-service:8084";
    ~^/(loyalty-service/)?loyalty/v1/ai-copilot(/|$)            "campaign-service:8084";
    ~^/(loyalty-service/)?loyalty/v1/alerts(/|$)                "campaign-service:8084";
    ~^/(loyalty-service/)?loyalty/v1/notification-preferences(/|$) "campaign-service:8084";
    ~^/(loyalty-service/)?loyalty/v1/inbox(/|$)                 "campaign-service:8084";

    # Customer-Service (Cổng 8082)
    ~^/(loyalty-service/)?loyalty/v1/admin/agents(/|$)          "customer-service:8082";
    ~^/(loyalty-service/)?loyalty/v1/agents(/|$)                "customer-service:8082";
    ~^/(loyalty-service/)?loyalty/v1/earn(/|$)                  "customer-service:8082";
    ~^/(loyalty-service/)?loyalty/v1/ledger(/|$)                "customer-service:8082";
    ~^/(loyalty-service/)?loyalty/v1/point-history(/|$)         "customer-service:8082";
    ~^/(loyalty-service/)?loyalty/v1/sso(/|$)                   "customer-service:8082";
    ~^/(loyalty-service/)?loyalty/v1/ussd(/|$)                  "customer-service:8082";
    ~^/(loyalty-service/)?loyalty/v1/wallet(/|$)                "customer-service:8082";
    ~^/(loyalty-service/)?loyalty/v1/vouchers(/|$)              "customer-service:8082";
    ~^/(loyalty-service/)?loyalty/v1/reward-wallet(/|$)         "customer-service:8082";
    ~^/(loyalty-service/)?loyalty/v1/devices(/|$)               "customer-service:8082";
    ~^/(loyalty-service/)?loyalty/v1/accounts(/|$)              "customer-service:8082";
    ~^/(loyalty-service/)?loyalty/v1/profile(/|$)               "customer-service:8082";
    ~^/(loyalty-service/)?loyalty/v1/tiers(/|$)                 "customer-service:8082";

    # CMS-Service (Cổng 8081) - Auth, Admin, System Params, Policies, Partners, Approvals, Dashboard, Reports
    ~^/(loyalty-service/)?categories(/|$)                      "cms-service:8081";
    ~^/(loyalty-service/)?api/v1/admin/categories(/|$)         "cms-service:8081";
    ~^/(loyalty-service/)?loyalty/v1/general-categories(/|$)    "cms-service:8081";
    ~^/(loyalty-service/)?loyalty/v1/admin/categories(/|$)      "cms-service:8081";
    ~^/(loyalty-service/)?loyalty/v1/system-parameters(/|$)     "cms-service:8081";
    ~^/(loyalty-service/)?loyalty/v1/approvals(/|$)             "cms-service:8081";
    ~^/(loyalty-service/)?loyalty/v1/dashboard(/|$)             "cms-service:8081";
    ~^/(loyalty-service/)?loyalty/v1/reports(/|$)               "cms-service:8081";
    ~^/(loyalty-service/)?loyalty/v1/integrations(/|$)          "cms-service:8081";
    ~^/(loyalty-service/)?loyalty/v1/partners(/|$)              "cms-service:8081";
    ~^/(loyalty-service/)?loyalty/v1/policies(/|$)              "cms-service:8081";
    ~^/(loyalty-service/)?loyalty/v1/media(/|$)                 "cms-service:8081";
    ~^/(loyalty-service/)?loyalty/v1/admin(/|$)                 "cms-service:8081";
}

# ------------------------------------------------------------------------------
# 1. API GATEWAY & CORS CONTROLLER: api.mid.io.vn
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name api.mid.io.vn;
    client_max_body_size 15M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 9;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    location = /gateway-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","gateway":"loyalty-nginx-gateway","upstreams":5}';
    }

    location / {
        # Đảm bảo header CORS luôn hiện diện trên mọi phản hồi (200, 4xx, 5xx)
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Tenant-Id,X-Partner-Id,X-Api-Key,X-Signature,X-Timestamp,language' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Xử lý Preflight CORS OPTIONS trực tiếp tại Nginx Gateway
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Tenant-Id,X-Partner-Id,X-Api-Key,X-Signature,X-Timestamp,language' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Credentials';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';

        rewrite ^/loyalty-service/(.*)$ /$1 break;
        proxy_pass http://$loyalty_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ------------------------------------------------------------------------------
# 2. OPENAPI & SWAGGER DOCS: docs.mid.io.vn
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name docs.mid.io.vn;

    location = / {
        return 301 /swagger-ui/index.html;
    }

    location = /gateway-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","gateway":"loyalty-nginx-gateway","upstreams":5}';
    }

    location / {
        rewrite ^/loyalty-service/(.*)$ /$1 break;
        proxy_pass http://$loyalty_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 3. CỔNG QUẢN TRỊ CMS (SPA ROUTER): cms.mid.io.vn
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name cms.mid.io.vn;
    client_max_body_size 15M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 9;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Định tuyến API same-origin (không trùng route SPA)
    location ~* ^/(api|actuator|loyalty|gamehub/v1)/ {
        rewrite ^/loyalty-service/(.*)$ /$1 break;
        proxy_pass http://$loyalty_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Phục vụ toàn bộ giao diện CMS SPA (kể cả /auth/login, /auth/reset-password, /dashboard,...)
    location = /gateway-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","gateway":"loyalty-nginx-gateway","upstreams":5}';
    }

    location / {
        set $loyalty_cms_upstream "loyalty-cms:80";
        proxy_pass http://$loyalty_cms_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# ==============================================================================
# CẤU HÌNH NGINX GATEWAY — MÔ HÌNH SAAS MULTI-TENANT (MICRO-LOYALTY)
# Vị trí: deploy/micro-loyalty/config/nginx/nginx-saas.conf
# ==============================================================================

upstream loyalty_backend {
    server loyalty-service:8088;
    keepalive 64;
}

upstream loyalty_cms_upstream {
    server loyalty-cms:80;
    keepalive 32;
}

upstream loyalty_webview_upstream {
    server loyalty-webview:80;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. API GATEWAY & CORS CONTROLLER: api.mid.io.vn
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name api.mid.io.vn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    location / {
        # Xử lý Preflight CORS OPTIONS trực tiếp tại Nginx Gateway
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Tenant-Id,X-Api-Key,X-Signature,X-Timestamp,language' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://loyalty_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ------------------------------------------------------------------------------
# 2. OPENAPI & SWAGGER DOCS: docs.mid.io.vn
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name docs.mid.io.vn;

    location = / {
        return 301 /swagger-ui/index.html;
    }

    location / {
        proxy_pass http://loyalty_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 3. CỔNG QUẢN TRỊ CMS (SPA ROUTER): cms.mid.io.vn
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name cms.mid.io.vn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Phục vụ toàn bộ giao diện CMS SPA (kể cả /auth/login, /auth/reset-password, /dashboard,...)
    location / {
        proxy_pass http://loyalty_cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 4. CỔNG TRẢI NGHIỆM WEBVIEW (SPA ROUTER): portal.mid.io.vn
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name portal.mid.io.vn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Phục vụ giao diện Webview SPA
    location / {
        proxy_pass http://loyalty_webview_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 5. DEFAULT FALLBACK SERVER (BY IP & UNKNOWN HOSTS)
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    # Backend API & Actuator Routing
    location ~* ^/(api|actuator|auth|loyalty|users|v1|cms)/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Tenant-Id,X-Api-Key,X-Signature,X-Timestamp,language' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://loyalty_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webview Portal Fallback
    location /gamehub/ {
        proxy_pass http://loyalty_webview_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /portal/ {
        proxy_pass http://loyalty_webview_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Root Fallback: Phục vụ CMS
    location / {
        proxy_pass http://loyalty_cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

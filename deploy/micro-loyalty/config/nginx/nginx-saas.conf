# ==============================================================================
# CẤU HÌNH NGINX GATEWAY — MÔ HÌNH SAAS MULTI-TENANT (MICRO-LOYALTY)
# Vị trí: deploy/micro-loyalty/config/nginx/nginx-saas.conf
# ==============================================================================

upstream cms_service_upstream {
    server cms-service:8081;
    keepalive 32;
}

upstream customer_service_upstream {
    server customer-service:8082;
    keepalive 64;
}

upstream game_service_upstream {
    server game-service:8083;
    keepalive 64;
}

upstream campaign_service_upstream {
    server campaign-service:8084;
    keepalive 32;
}

upstream partner_service_upstream {
    server partner-service:8085;
    keepalive 64;
}

# Định tuyến API tự động về đúng Microservice theo tiền tố đường dẫn (ưu tiên khớp dài trước)
map $uri $loyalty_api_upstream {
    default cms_service_upstream;

    # Game-Service (Cổng 8083)
    ~^/(loyalty-service/)?gamehub/v1(/|$)                       game_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/luckydraw(/|$)             game_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/admin/learning(/|$)        game_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/admin/games(/|$)           game_service_upstream;

    # Partner-Service (Cổng 8085)
    ~^/(loyalty-service/)?loyalty/v1/admin/dead-letter(/|$)     partner_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/partners/locations(/|$)    partner_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/payment-points(/|$)        partner_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/partner-portal(/|$)        partner_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/partner(/|$)               partner_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/clearinghouse(/|$)         partner_service_upstream;

    # Campaign-Service (Cổng 8084)
    ~^/(loyalty-service/)?loyalty/v1/segments(/|$)              campaign_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/engagement(/|$)            campaign_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/milestones(/|$)            campaign_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/campaigns(/|$)             campaign_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/referrals(/|$)             campaign_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/budgets(/|$)               campaign_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/ai-copilot(/|$)            campaign_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/alerts(/|$)                campaign_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/notification-preferences(/|$) campaign_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/inbox(/|$)                 campaign_service_upstream;

    # Customer-Service (Cổng 8082)
    ~^/(loyalty-service/)?loyalty/v1/admin/agents(/|$)          customer_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/agents(/|$)                customer_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/earn(/|$)                  customer_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/ledger(/|$)                customer_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/point-history(/|$)         customer_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/sso(/|$)                   customer_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/ussd(/|$)                  customer_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/wallet(/|$)                customer_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/vouchers(/|$)              customer_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/reward-wallet(/|$)         customer_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/devices(/|$)               customer_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/accounts(/|$)              customer_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/profile(/|$)               customer_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/tiers(/|$)                 customer_service_upstream;

    # CMS-Service (Cổng 8081) - Auth, Admin, System Params, Policies, Partners, Approvals, Dashboard, Reports
    ~^/(loyalty-service/)?loyalty/v1/system-parameters(/|$)     cms_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/approvals(/|$)             cms_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/dashboard(/|$)             cms_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/reports(/|$)               cms_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/integrations(/|$)          cms_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/partners(/|$)              cms_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/policies(/|$)              cms_service_upstream;
    ~^/(loyalty-service/)?loyalty/v1/admin(/|$)                 cms_service_upstream;
}

upstream loyalty_cms_upstream {
    server loyalty-cms:80;
    keepalive 32;
}

upstream loyalty_webview_upstream {
    server loyalty-webview:80;
    keepalive 32;
}

upstream loyalty_partner_portal_upstream {
    server loyalty-partner-portal:80;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. API GATEWAY & CORS CONTROLLER: api.mid.io.vn
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name api.mid.io.vn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 9;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    location = /gateway-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","gateway":"loyalty-nginx-gateway","upstreams":5}';
    }

    location / {
        # Đảm bảo header CORS luôn hiện diện trên mọi phản hồi (200, 4xx, 5xx)
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Tenant-Id,X-Partner-Id,X-Api-Key,X-Signature,X-Timestamp,language' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Xử lý Preflight CORS OPTIONS trực tiếp tại Nginx Gateway
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Tenant-Id,X-Partner-Id,X-Api-Key,X-Signature,X-Timestamp,language' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Credentials';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';

        rewrite ^/loyalty-service/(.*)$ /$1 break;
        proxy_pass http://$loyalty_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ------------------------------------------------------------------------------
# 2. OPENAPI & SWAGGER DOCS: docs.mid.io.vn
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name docs.mid.io.vn;

    location = / {
        return 301 /swagger-ui/index.html;
    }

    location = /gateway-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","gateway":"loyalty-nginx-gateway","upstreams":5}';
    }

    location / {
        rewrite ^/loyalty-service/(.*)$ /$1 break;
        proxy_pass http://$loyalty_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 3. CỔNG QUẢN TRỊ CMS (SPA ROUTER): cms.mid.io.vn
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name cms.mid.io.vn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 9;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Định tuyến API same-origin (không trùng route SPA)
    location ~* ^/(api|actuator|loyalty|gamehub/v1)/ {
        rewrite ^/loyalty-service/(.*)$ /$1 break;
        proxy_pass http://$loyalty_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Phục vụ toàn bộ giao diện CMS SPA (kể cả /auth/login, /auth/reset-password, /dashboard,...)
    location = /gateway-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","gateway":"loyalty-nginx-gateway","upstreams":5}';
    }

    location / {
        proxy_pass http://loyalty_cms_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------

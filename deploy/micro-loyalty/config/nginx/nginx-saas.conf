# ------------------------------------------------------------------------------
# 5. DEFAULT FALLBACK SERVER (BY IP & UNKNOWN HOSTS)
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 15M;

    location = /gateway-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","gateway":"loyalty-nginx-gateway","upstreams":5}';
    }

    # Backend API & Actuator Routing
    location ~* ^/(api|actuator|auth|loyalty|gamehub/v1|users|v1|cms|roles|policies|system-parameters|partners|admin)/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Tenant-Id,X-Api-Key,X-Signature,X-Timestamp,language' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        rewrite ^/loyalty-service/(.*)$ /$1 break;
        proxy_pass http://$loyalty_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webview Portal Fallback
    location /gamehub/ {
        set $loyalty_webview_upstream "loyalty-webview:80";
        rewrite ^/gamehub/(.*)$ /$1 break;
        proxy_pass http://$loyalty_webview_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /portal/ {
        set $loyalty_webview_upstream "loyalty-webview:80";
        rewrite ^/portal/(.*)$ /$1 break;
        proxy_pass http://$loyalty_webview_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /partner-portal/ {
        set $loyalty_partner_portal_upstream "loyalty-partner-portal:80";
        rewrite ^/partner-portal/(.*)$ /$1 break;
        proxy_pass http://$loyalty_partner_portal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Root Fallback: Phục vụ CMS
    location / {
        set $loyalty_cms_upstream "loyalty-cms:80";
        proxy_pass http://$loyalty_cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

    listen 80;
    server_name portal.mid.io.vn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 9;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Định tuyến API same-origin (SSO exchange-token, GameHub, Reward Wallet...)
    location ~* ^/(api|actuator|loyalty|gamehub/v1)/ {
        rewrite ^/loyalty-service/(.*)$ /$1 break;
        proxy_pass http://$loyalty_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Phục vụ giao diện Webview SPA
    location = /gateway-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","gateway":"loyalty-nginx-gateway","upstreams":5}';
    }

    location / {
        proxy_pass http://loyalty_webview_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 4B. CỔNG ĐỐI TÁC (PARTNER PORTAL SPA ROUTER): partner.mid.io.vn
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name partner.mid.io.vn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 9;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Định tuyến API same-origin cho Partner Portal
    location ~* ^/(api|actuator|loyalty|gamehub/v1)/ {
        rewrite ^/loyalty-service/(.*)$ /$1 break;
        proxy_pass http://$loyalty_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /gateway-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","gateway":"loyalty-nginx-gateway","upstreams":5}';
    }

    location / {
        proxy_pass http://loyalty_partner_portal_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 5. DEFAULT FALLBACK SERVER (BY IP & UNKNOWN HOSTS)
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    location = /gateway-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","gateway":"loyalty-nginx-gateway","upstreams":5}';
    }

    # Backend API & Actuator Routing
    location ~* ^/(api|actuator|auth|loyalty|gamehub/v1|users|v1|cms|roles|policies|system-parameters|partners|admin)/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Tenant-Id,X-Api-Key,X-Signature,X-Timestamp,language' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        rewrite ^/loyalty-service/(.*)$ /$1 break;
        proxy_pass http://$loyalty_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webview Portal Fallback
    location /gamehub/ {
        proxy_pass http://loyalty_webview_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /portal/ {
        proxy_pass http://loyalty_webview_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /partner-portal/ {
        proxy_pass http://loyalty_partner_portal_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Root Fallback: Phục vụ CMS
    location / {
        proxy_pass http://loyalty_cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ==============================================================================
# CẤU HÌNH NGOẠI VI — MÔ HÌNH SAAS MULTI-TENANT (MICRO-LOYALTY)
# Vị trí: deploy/micro-loyalty/config/backend/application-saas.yml
# ==============================================================================

server:
  port: ${LOYALTY_SERVICE_PORT:8088}
  shutdown: graceful
  servlet:
    context-path: /

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: loyalty-service-saas
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/${POSTGRES_DB:loyalty_db}?sslmode=prefer
    username: ${POSTGRES_USER:loyalty_app}
    password: ${POSTGRES_PASSWORD:Loyalty_SecureDB2026!}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${POSTGRES_MAX_POOL_SIZE:30}
      minimum-idle: ${POSTGRES_MIN_IDLE:5}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: LoyaltySaasHikariCP
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      password: ${REDIS_PASSWORD:Loyalty_RedisPass2026!}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
  redis:
    host: ${REDIS_HOST:redis}
    port: 6379
    password: ${REDIS_PASSWORD:Loyalty_RedisPass2026!}
    database: ${REDIS_DATABASE:0}
    timeout: 3000ms
  messages:
    basename: file:/app/locales/messages
    encoding: UTF-8
    cache-duration: 3600

loyalty:
  deployment-mode: SAAS_MULTI_TENANT
  security:
    timestamp-tolerance-seconds: ${DRIFT_TOLERANCE_SECONDS:300}
  outbox:
    max-retries: ${OUTBOX_MAX_RETRIES:5}
    batch-size: 50
    publish-interval-ms: 1000
  stream:
    channel-prefix: loyalty.events.
  locales-path: /app/locales

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

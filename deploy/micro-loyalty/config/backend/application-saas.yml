# ==============================================================================
# CẤU HÌNH NGOẠI VI — MÔ HÌNH SAAS MULTI-TENANT (MICRO-LOYALTY)
# Vị trí: deploy/micro-loyalty/config/backend/application-saas.yml
# ==============================================================================

server:
  port: ${SERVER_PORT:${LOYALTY_SERVICE_PORT:8081}}
  shutdown: graceful
  servlet:
    context-path: /

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: ${SPRING_APPLICATION_NAME:loyalty-service-saas}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/${POSTGRES_DB:loyalty_db}?sslmode=prefer
    username: ${POSTGRES_USER:loyalty_app}
    password: ${POSTGRES_PASSWORD:Loyalty_SecureDB2026!}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${POSTGRES_MAX_POOL_SIZE:12}
      minimum-idle: ${POSTGRES_MIN_IDLE:2}
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: LoyaltySaasHikariCP
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      password: ${REDIS_PASSWORD:Loyalty_RedisPass2026!}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
  redis:
    host: ${REDIS_HOST:redis}
    port: 6379
    password: ${REDIS_PASSWORD:Loyalty_RedisPass2026!}
    database: ${REDIS_DATABASE:0}
    timeout: 3000ms
  messages:
    basename: file:/app/etc/messages,file:/app/locales/messages,classpath:i18n/messages
    encoding: UTF-8
    cache-duration: 3600

loyalty:
  deployment-mode: SAAS_MULTI_TENANT
  security:
    timestamp-drift-tolerance-seconds: ${DRIFT_TOLERANCE_SECONDS:300}
    timestamp-tolerance-seconds: ${DRIFT_TOLERANCE_SECONDS:300}
    master-key: ${LOYALTY_MASTER_KEY:}
  tenant:
    default-tenant: ${LOYALTY_DEFAULT_TENANT:NATCASH}
    header-name: X-Tenant-Id
  qr:
    token-ttl-seconds: ${LOYALTY_QR_TOKEN_TTL_SECONDS:60}
    default-ttl-seconds: ${LOYALTY_QR_DEFAULT_TTL_SECONDS:60}
  wallet:
    max-burn-percent-per-bill: ${LOYALTY_MAX_BURN_PERCENT_PER_BILL:50.00}
    default-point-expiration-months: ${LOYALTY_DEFAULT_POINT_EXPIRATION_MONTHS:12}
  session:
    ticket-ttl-seconds: ${LOYALTY_SESSION_TICKET_TTL_SECONDS:60}
    access-token-ttl-seconds: ${LOYALTY_SESSION_ACCESS_TOKEN_TTL_SECONDS:900}
  webhook:
    max-retries: ${OUTBOX_MAX_RETRIES:5}
  lock:
    wait-time-ms: ${LOYALTY_LOCK_WAIT_TIME_MS:3000}
    lease-time-ms: ${LOYALTY_LOCK_LEASE_TIME_MS:10000}
    short-lease-time-ms: ${LOYALTY_LOCK_SHORT_LEASE_TIME_MS:5000}
  engagement:
    quiet-hours-start-hour: ${LOYALTY_QUIET_HOURS_START:20}
    quiet-hours-end-hour: ${LOYALTY_QUIET_HOURS_END:8}
    timezone: ${LOYALTY_ENGAGEMENT_TIMEZONE:America/Port-au-Prince}
    max-push-per-day: ${LOYALTY_MAX_PUSH_PER_DAY:1}
    max-push-per-week: ${LOYALTY_MAX_PUSH_PER_WEEK:3}
    default-dedup-window-hours: ${LOYALTY_DEFAULT_DEDUP_WINDOW_HOURS:24}
  budget:
    alert-threshold-percent: ${LOYALTY_BUDGET_ALERT_THRESHOLD_PERCENT:80}
    hard-stop-percent: ${LOYALTY_BUDGET_HARD_STOP_PERCENT:100}
  partner:
    api-key-grace-period-days: ${LOYALTY_API_KEY_GRACE_PERIOD_DAYS:7}
    lookback-days: ${LOYALTY_PARTNER_LOOKBACK_DAYS:180}
    tx-page-size: ${LOYALTY_PARTNER_TX_PAGE_SIZE:200}
    recent-tx-limit: ${LOYALTY_PARTNER_RECENT_TX_LIMIT:20}
    default-max-burn-percent: ${LOYALTY_PARTNER_DEFAULT_MAX_BURN_PERCENT:50.00}
  tier:
    expiry-warning-days: ${LOYALTY_TIER_EXPIRY_WARNING_DAYS:30}
  settlement:
    confirm-deadline-days: ${LOYALTY_SETTLEMENT_CONFIRM_DEADLINE_DAYS:3}
    default-mdr-fee-percent: ${LOYALTY_DEFAULT_MDR_FEE_PERCENT:1.50}
  campaign:
    default-control-group-percent: ${LOYALTY_DEFAULT_CONTROL_GROUP_PERCENT:5}
  agent:
    monthly-new-customer-target: ${LOYALTY_AGENT_MONTHLY_TARGET:100}
    reward-htg: ${LOYALTY_AGENT_REWARD_HTG:2000}
    super-agent-min-achievement-pct: ${LOYALTY_SUPER_AGENT_MIN_ACHIEVEMENT_PCT:50}
    super-agent-reward-htg: ${LOYALTY_SUPER_AGENT_REWARD_HTG:10000}
  learning:
    tier1-correct: ${LOYALTY_LEARNING_TIER1_CORRECT:5}
    tier2-correct: ${LOYALTY_LEARNING_TIER2_CORRECT:10}
    tier3-correct: ${LOYALTY_LEARNING_TIER3_CORRECT:15}
  approval:
    default-point-adjustment-max-limit: ${LOYALTY_DEFAULT_POINT_ADJUSTMENT_MAX_LIMIT:100000.00}
  system-param:
    default-value-type: ${LOYALTY_PARAM_DEFAULT_VALUE_TYPE:STRING}
    default-group-code: ${LOYALTY_PARAM_DEFAULT_GROUP_CODE:GENERAL}
  integration:
    natcash:
      base-url: ${NATCASH_WALLET_BASE_URL:}
      api-key: ${NATCASH_WALLET_API_KEY:}
    sms:
      gateway-url: ${NATCOM_SMS_GATEWAY_URL:}
      brandname: ${NATCOM_SMS_BRANDNAME:}
  outbox:
    max-retries: ${OUTBOX_MAX_RETRIES:5}
    batch-size: 50
    publish-interval-ms: 1000
  stream:
    channel-prefix: loyalty.events.
  locales-path: /app/locales

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

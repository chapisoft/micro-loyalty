# ==============================================================================
# HỆ SINH THÁI LOYALTY — MÔ HÌNH SAAS ĐA THUÊ BAO (MICRO-LOYALTY)
# Máy chủ: 210.211.102.99:65000 (User: dip) — Đồng máy chủ với DIP & Smart-OTP
# Vị trí: deploy/micro-loyalty/docker-compose.yml
# ==============================================================================

networks:
  loyalty-saas-network:
    name: loyalty-saas-network
    driver: bridge

volumes:
  loyalty_saas_postgres_data:
  loyalty_saas_redis_data:

services:
  # 1. PostgreSQL 15+ Độc Lập Chuyên Dụng Cho Loyalty (Cổng Host 15435)
  postgres:
    image: postgres:15-alpine
    container_name: loyalty-saas-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-15435}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loyalty_db}
      POSTGRES_USER: ${POSTGRES_USER:-loyalty_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Loyalty_SecureDB2026!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - loyalty_saas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loyalty_app -d loyalty_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - loyalty-saas-network

  # 2. Redis 7 Chuyên Dụng Cho Loyalty (Cổng Host 16385)
  redis:
    image: redis:7-alpine
    container_name: loyalty-saas-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-16385}:6379"
    command:
      - redis-server
      - --requirepass
      - Loyalty_RedisPass2026!
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - loyalty_saas_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Loyalty_RedisPass2026!", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - loyalty-saas-network

  # 3. Loyalty Service Backend (Bản dựng bất biến + Nạp cấu hình & Locales ngoại vi)
  loyalty-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: loyalty/loyalty-service:latest
    container_name: loyalty-saas-service
    restart: unless-stopped
    expose:
      - "8088"
    env_file:
      - .env
    volumes:
      - ./config/backend:/app/config:ro
      - ./locales:/app/locales:ro
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - loyalty-saas-network

  # 4. Loyalty CMS (Bản dựng bất biến + Nạp runtime env-config.json & Locales ngoại vi)
  loyalty-cms:
    build:
      context: ./frontend/cms
      dockerfile: Dockerfile
    image: loyalty/loyalty-cms:latest
    container_name: loyalty-saas-cms
    restart: unless-stopped
    volumes:
      - ./config/frontend/env-config.json:/usr/share/nginx/html/config/env-config.json:ro
      - ./locales:/usr/share/nginx/html/locales:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - loyalty-saas-network

  # 5. Loyalty Webview (Bản dựng bất biến + Nạp runtime config & Locales ngoại vi)
  loyalty-webview:
    build:
      context: ./frontend/webview
      dockerfile: Dockerfile
    image: loyalty/loyalty-webview:latest
    container_name: loyalty-saas-webview
    restart: unless-stopped
    volumes:
      - ./config/frontend/env-config.json:/usr/share/nginx/html/config/env-config.json:ro
      - ./locales:/usr/share/nginx/html/locales:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - loyalty-saas-network

  # 6. Nginx Gateway Reverse Proxy (Cổng Host 18095)
  gateway:
    image: nginx:1.25-alpine
    container_name: loyalty-saas-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_PORT:-18095}:80"
    volumes:
      - ./config/nginx/nginx-saas.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - loyalty-service
      - loyalty-cms
      - loyalty-webview
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - loyalty-saas-network

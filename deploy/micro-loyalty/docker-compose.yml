version: '3.8'

# ==============================================================================
# HỆ SINH THÁI LOYALTY — MÔ HÌNH SAAS MULTI-TENANT (MICRO-LOYALTY)
# Vị trí: deploy/micro-loyalty/docker-compose.yml
# ==============================================================================

networks:
  loyalty-saas-network:
    name: loyalty-saas-network
    driver: bridge

volumes:
  loyalty_saas_postgres_data:
  loyalty_saas_redis_data:

services:
  # 1. PostgreSQL 15+ Độc Lập
  postgres:
    image: postgres:15-alpine
    container_name: loyalty-saas-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loyalty_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-T3st$2025}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - loyalty_saas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-loyalty_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - loyalty-saas-network

  # 2. Redis 7
  redis:
    image: redis:7-alpine
    container_name: loyalty-saas-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-NatCash2022} 
      --maxmemory 1024mb 
      --maxmemory-policy allkeys-lru
    volumes:
      - loyalty_saas_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-NatCash2022}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - loyalty-saas-network

  # 3. Loyalty Service Backend (Bản dựng bất biến + Nạp cấu hình & Locales ngoại vi)
  loyalty-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: loyalty/loyalty-service:latest
    container_name: loyalty-saas-service
    restart: unless-stopped
    ports:
      - "${LOYALTY_SERVICE_PORT:-8085}:8085"
    env_file:
      - .env
    volumes:
      - ./config/backend:/app/config:ro
      - ./locales:/app/locales:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - loyalty-saas-network

  # 4. Loyalty CMS (Bản dựng bất biến + Nạp runtime env-config.json & Locales ngoại vi)
  loyalty-cms:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: loyalty/loyalty-cms:latest
    container_name: loyalty-saas-cms
    restart: unless-stopped
    volumes:
      - ./config/frontend/env-config.json:/usr/share/nginx/html/config/env-config.json:ro
      - ./locales:/usr/share/nginx/html/locales:ro
    networks:
      - loyalty-saas-network

  # 5. Loyalty Webview (Bản dựng bất biến + Nạp runtime config & Locales ngoại vi)
  loyalty-webview:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: loyalty/loyalty-webview:latest
    container_name: loyalty-saas-webview
    restart: unless-stopped
    volumes:
      - ./config/frontend/env-config.json:/usr/share/nginx/html/config/env-config.json:ro
      - ./locales:/usr/share/nginx/html/locales:ro
    networks:
      - loyalty-saas-network

  # 6. Nginx Gateway Reverse Proxy
  gateway:
    image: nginx:1.25-alpine
    container_name: loyalty-saas-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_PORT:-18090}:80"
    volumes:
      - ./config/nginx/nginx-saas.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - loyalty-service
      - loyalty-cms
      - loyalty-webview
    networks:
      - loyalty-saas-network

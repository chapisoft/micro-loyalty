global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'telegram-bot' # Default receiver (placeholder)

receivers:
  - name: 'telegram-bot'
    telegram_configs:
      - bot_token: '8694821173:AAFJ3XlvDpYRywzEiB54RSNjAdS62XPKZXA'
        chat_id: -5397937309
        message: |-
          {{ range .Alerts }}
          🚨 <b>[PROMETHEUS-NATCASH-ALERT] {{ .Annotations.summary }}</b>
          • <b>Mức độ (Severity):</b> <code>{{ .Labels.severity }}</code>
          • <b>Mô tả:</b> {{ .Annotations.description }}
          • <b>Thời gian bắt đầu:</b> {{ .StartsAt }}
          {{ end }}
        parse_mode: 'HTML'

  - name: 'slack-webhook'
    slack_configs:
      - api_url: 'YOUR_SLACK_WEBHOOK_URL' # TODO: Replace with real webhook
        channel: '#alerts'
        text: >-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          Severity: {{ .Labels.severity }}
          Description: {{ .Annotations.description }}
          {{ end }}

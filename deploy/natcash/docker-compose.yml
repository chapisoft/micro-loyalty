version: '3.8'

# ==============================================================================
# HỆ THỐNG LOYALTY ON-PREMISE DÀNH CHO VÍ NATCASH (NATCASH ON-PREMISE)
# Vị trí: deploy/natcash/docker-compose.yml
# ==============================================================================

networks:
  loyalty-natcash-network:
    name: loyalty-natcash-network
    driver: bridge

volumes:
  loyalty_natcash_postgres_data:
  loyalty_natcash_redis_data:

services:
  # 1. PostgreSQL 15+ Nội bộ Natcash
  postgres:
    image: postgres:15-alpine
    container_name: loyalty-natcash-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-natcash_loyalty_db}
      POSTGRES_USER: ${POSTGRES_USER:-natcash_loyalty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Natcash$$SecureDB2026!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - loyalty_natcash_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-natcash_loyalty} -d ${POSTGRES_DB:-natcash_loyalty_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - loyalty-natcash-network

  # 2. Redis 7 Nội bộ Natcash
  redis:
    image: redis:7-alpine
    container_name: loyalty-natcash-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-Natcash$$RedisPass2026!}", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - loyalty_natcash_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-Natcash$$RedisPass2026!}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - loyalty-natcash-network

  # 3. Các Microservices Backend Độc Lập (Dùng chung PostgreSQL 15+ & Redis 7 Nội bộ Natcash)
  cms-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: cms-service
    image: loyalty/cms-service:latest
    container_name: loyalty-natcash-cms-service
    restart: unless-stopped
    ports:
      - "${CMS_SERVICE_PORT:-8081}:8081"
    env_file:
      - .env
    environment:
      SERVER_PORT: 8081
      LOYALTY_SERVICE_PORT: 8081
      SPRING_APPLICATION_NAME: cms-service
      SPRING_FLYWAY_ENABLED: "true"
      JAVA_OPTS: ${LOYALTY_JVM_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError}
    volumes:
      - ./config/backend:/app/config:ro
      - ./locales:/app/locales:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - loyalty-natcash-network

  customer-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: customer-service
    image: loyalty/customer-service:latest
    container_name: loyalty-natcash-customer-service
    restart: unless-stopped
    ports:
      - "${CUSTOMER_SERVICE_PORT:-8082}:8082"
    env_file:
      - .env
    environment:
      SERVER_PORT: 8082
      LOYALTY_SERVICE_PORT: 8082
      SPRING_APPLICATION_NAME: customer-service
      SPRING_FLYWAY_ENABLED: "false"
      JAVA_OPTS: ${LOYALTY_JVM_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError}
    volumes:
      - ./config/backend:/app/config:ro
      - ./locales:/app/locales:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - loyalty-natcash-network

  game-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: game-service
    image: loyalty/game-service:latest
    container_name: loyalty-natcash-game-service
    restart: unless-stopped
    ports:
      - "${GAME_SERVICE_PORT:-8083}:8083"
    env_file:
      - .env
    environment:
      SERVER_PORT: 8083
      LOYALTY_SERVICE_PORT: 8083
      SPRING_APPLICATION_NAME: game-service
      SPRING_FLYWAY_ENABLED: "false"
      JAVA_OPTS: ${LOYALTY_JVM_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError}
    volumes:
      - ./config/backend:/app/config:ro
      - ./locales:/app/locales:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - loyalty-natcash-network

  campaign-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: campaign-service
    image: loyalty/campaign-service:latest
    container_name: loyalty-natcash-campaign-service
    restart: unless-stopped
    ports:
      - "${CAMPAIGN_SERVICE_PORT:-8084}:8084"
    env_file:
      - .env
    environment:
      SERVER_PORT: 8084
      LOYALTY_SERVICE_PORT: 8084
      SPRING_APPLICATION_NAME: campaign-service
      SPRING_FLYWAY_ENABLED: "false"
      JAVA_OPTS: ${LOYALTY_JVM_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError}
    volumes:
      - ./config/backend:/app/config:ro
      - ./locales:/app/locales:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - loyalty-natcash-network

  partner-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: partner-service
    image: loyalty/partner-service:latest
    container_name: loyalty-natcash-partner-service
    restart: unless-stopped
    ports:
      - "${PARTNER_SERVICE_PORT:-8085}:8085"
    env_file:
      - .env
    environment:
      SERVER_PORT: 8085
      LOYALTY_SERVICE_PORT: 8085
      SPRING_APPLICATION_NAME: partner-service
      SPRING_FLYWAY_ENABLED: "false"
      JAVA_OPTS: ${LOYALTY_JVM_OPTS:--Xms128m -Xmx512m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError}
    volumes:
      - ./config/backend:/app/config:ro
      - ./locales:/app/locales:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - loyalty-natcash-network

  # 4. Loyalty CMS (Bản dựng bất biến + Nạp runtime env-config.json & Locales ngoại vi)
  loyalty-cms:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: loyalty/loyalty-cms:latest
    container_name: loyalty-natcash-cms
    restart: unless-stopped
    volumes:
      - ./config/frontend/env-config.json:/usr/share/nginx/html/config/env-config.json:ro
      - ./locales:/usr/share/nginx/html/locales:ro
    networks:
      - loyalty-natcash-network

  # 5. Loyalty Webview (Bản dựng bất biến + Nạp runtime config & Locales ngoại vi)
  loyalty-webview:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: loyalty/loyalty-webview:latest
    container_name: loyalty-natcash-webview
    restart: unless-stopped
    volumes:
      - ./config/frontend/env-config.json:/usr/share/nginx/html/config/env-config.json:ro
      - ./locales:/usr/share/nginx/html/locales:ro
    networks:
      - loyalty-natcash-network

  # 6. Nginx Gateway Reverse Proxy Nội Bộ
  gateway:
    image: nginx:1.25-alpine
    container_name: loyalty-natcash-gateway
    restart: unless-stopped
    ports:
      - "${ONPREM_HTTP_PORT:-80}:80"
    volumes:
      - ./config/nginx/nginx-natcash.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cms-service
      - customer-service
      - game-service
      - campaign-service
      - partner-service
      - loyalty-cms
      - loyalty-webview
    networks:
      - loyalty-natcash-network

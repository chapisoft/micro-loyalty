# ==============================================================================
# CẤU HÌNH NGINX REVERSE PROXY — MÔ HÌNH ON-PREMISE VÍ NATCASH
# Vị trí: deploy/natcash/config/nginx/nginx-natcash.conf
# ==============================================================================

upstream cms_service_upstream {
    server 127.0.0.1:8081;
    keepalive 32;
}

upstream customer_service_upstream {
    server 127.0.0.1:8082;
    keepalive 32;
}

upstream game_service_upstream {
    server 127.0.0.1:8083;
    keepalive 32;
}

upstream campaign_service_upstream {
    server 127.0.0.1:8084;
    keepalive 32;
}

upstream partner_service_upstream {
    server 127.0.0.1:8085;
    keepalive 32;
}

# Định tuyến nội bộ Nginx về đúng Microservice theo tiền tố API
map $uri $natcash_api_upstream {
    default cms_service_upstream;

    # Game-Service (Cổng 8083)
    ~^/gamehub/v1(/|$)                       game_service_upstream;
    ~^/loyalty/v1/luckydraw(/|$)             game_service_upstream;
    ~^/loyalty/v1/admin/learning(/|$)        game_service_upstream;
    ~^/loyalty/v1/admin/games(/|$)           game_service_upstream;

    # Partner-Service (Cổng 8085)
    ~^/loyalty/v1/admin/dead-letter(/|$)     partner_service_upstream;
    ~^/loyalty/v1/partners/locations(/|$)    partner_service_upstream;
    ~^/loyalty/v1/payment-points(/|$)        partner_service_upstream;
    ~^/loyalty/v1/partner-portal(/|$)        partner_service_upstream;
    ~^/loyalty/v1/partner(/|$)               partner_service_upstream;
    ~^/loyalty/v1/clearinghouse(/|$)         partner_service_upstream;

    # Campaign-Service (Cổng 8084)
    ~^/loyalty/v1/segments(/|$)              campaign_service_upstream;
    ~^/loyalty/v1/engagement(/|$)            campaign_service_upstream;
    ~^/loyalty/v1/milestones(/|$)            campaign_service_upstream;
    ~^/loyalty/v1/campaigns(/|$)             campaign_service_upstream;
    ~^/loyalty/v1/referrals(/|$)             campaign_service_upstream;
    ~^/loyalty/v1/budgets(/|$)               campaign_service_upstream;
    ~^/loyalty/v1/ai-copilot(/|$)            campaign_service_upstream;
    ~^/loyalty/v1/alerts(/|$)                campaign_service_upstream;
    ~^/loyalty/v1/notification-preferences(/|$) campaign_service_upstream;
    ~^/loyalty/v1/inbox(/|$)                 campaign_service_upstream;

    # Customer-Service (Cổng 8082)
    ~^/loyalty/v1/admin/agents(/|$)          customer_service_upstream;
    ~^/loyalty/v1/agents(/|$)                customer_service_upstream;
    ~^/loyalty/v1/earn(/|$)                  customer_service_upstream;
    ~^/loyalty/v1/ledger(/|$)                customer_service_upstream;
    ~^/loyalty/v1/point-history(/|$)         customer_service_upstream;
    ~^/loyalty/v1/sso(/|$)                   customer_service_upstream;
    ~^/loyalty/v1/ussd(/|$)                  customer_service_upstream;
    ~^/loyalty/v1/wallet(/|$)                customer_service_upstream;
    ~^/loyalty/v1/vouchers(/|$)              customer_service_upstream;
    ~^/loyalty/v1/reward-wallet(/|$)         customer_service_upstream;
    ~^/loyalty/v1/devices(/|$)               customer_service_upstream;
    ~^/loyalty/v1/accounts(/|$)              customer_service_upstream;
    ~^/loyalty/v1/profile(/|$)               customer_service_upstream;
    ~^/loyalty/v1/tiers(/|$)                 customer_service_upstream;

    # CMS-Service (Cổng 8081)
    ~^/categories(/|$)                       cms_service_upstream;
    ~^/api/v1/admin/categories(/|$)          cms_service_upstream;
    ~^/loyalty/v1/general-categories(/|$)    cms_service_upstream;
    ~^/loyalty/v1/admin/categories(/|$)      cms_service_upstream;
    ~^/loyalty/v1/system-parameters(/|$)     cms_service_upstream;
    ~^/loyalty/v1/approvals(/|$)             cms_service_upstream;
    ~^/loyalty/v1/dashboard(/|$)             cms_service_upstream;
    ~^/loyalty/v1/reports(/|$)               cms_service_upstream;
    ~^/loyalty/v1/integrations(/|$)          cms_service_upstream;
    ~^/loyalty/v1/partners(/|$)              cms_service_upstream;
    ~^/loyalty/v1/policies(/|$)              cms_service_upstream;
    ~^/loyalty/v1/media(/|$)                 cms_service_upstream;
    ~^/loyalty/v1/admin(/|$)                 cms_service_upstream;
}

# ------------------------------------------------------------------------------
# 1. KHỐI MỞ RA INTERNET (CỔNG 8443 HTTPS SSL — CHỈ PHỤC VỤ WEBVIEW & API)
# Khóa hoàn toàn Cổng Quản trị CMS
# ------------------------------------------------------------------------------
server {
    listen 8443 ssl;
    server_name loyalty.natcom.com.ht testloyalty.natcom.com.ht;
    client_max_body_size 15M;

    ssl_certificate     /u01/mascom/build/nginx/conf/natcash/star_natcom.com.ht-nginx.crt;
    ssl_certificate_key /u01/mascom/build/nginx/conf/natcash/star_natcom.com.ht.key;

    access_log /u01/mascom/build/nginx/logs/natcash/loyalty_public.access.log;
    error_log  /u01/mascom/build/nginx/logs/natcash/loyalty_public.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # API GameHub Reverse Proxy (Game-Service 8083)
    location ^~ /gamehub/v1/ {
        proxy_pass http://game_service_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Reverse Proxy định tuyến tự động về 5 Microservices
    location ~* ^/(loyalty|api|auth)/ {
        proxy_pass http://$natcash_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cổng Webview & Game H5 Decoupled cho Mobile App
    location /gamehub/ {
        alias /u01/mascom/ringme/loyalty-game/web/webview/;
        index index.html;
        try_files $uri $uri/ /gamehub/index.html;

        location ~* /gamehub/(config|locales)/ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # Khóa CMS từ ngoài Internet
    location / {
        return 403 "Forbidden: Admin CMS is only accessible via internal VPN network.";
    }
}

# ------------------------------------------------------------------------------
# 2. KHỐI NỘI BỘ VPN (CỔNG 8080 HTTP — PHỤC VỤ CỔNG QUẢN TRỊ CMS NỘI BỘ)
# ------------------------------------------------------------------------------
server {
    listen 8080;
    server_name 10.228.37.65 localhost loyalty-admin.natcom.com.ht;
    client_max_body_size 15M;

    access_log /u01/mascom/build/nginx/logs/natcash/loyalty_internal.access.log;
    error_log  /u01/mascom/build/nginx/logs/natcash/loyalty_internal.error.log;

    # API GameHub Reverse Proxy (Game-Service 8083)
    location ^~ /gamehub/v1/ {
        proxy_pass http://game_service_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API Reverse Proxy cho CMS nội bộ (CMS / Customer / Game / Campaign / Partner)
    location ~* ^/(loyalty|api|auth|roles|users|policies|system-parameters|partners|admin|v1)/ {
        proxy_pass http://$natcash_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cổng Quản Trị Trung Tâm CMS Nội Bộ
    location / {
        root /u01/mascom/ringme/loyalty-game/web/cms;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* /(config|locales)/ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}

# ==============================================================================
# CẤU HÌNH NGINX REVERSE PROXY — MÔ HÌNH ON-PREMISE VÍ NATCASH
# Vị trí: deploy/natcash/config/nginx/nginx-natcash.conf
# ==============================================================================

upstream loyalty_natcash_backend {
    server loyalty-service:8085;
    keepalive 32;
}

upstream loyalty_natcash_cms {
    server loyalty-cms:80;
    keepalive 16;
}

upstream loyalty_natcash_webview {
    server loyalty-webview:80;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 1. API Reverse Proxy
    location /loyalty/ {
        proxy_pass http://loyalty_natcash_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. Cổng Webview & Game H5 Decoupled
    location /gamehub/ {
        proxy_pass http://loyalty_natcash_webview/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 3. Cổng Quản Trị Trung Tâm CMS
    location / {
        proxy_pass http://loyalty_natcash_cms/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

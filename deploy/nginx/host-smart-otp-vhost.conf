# ==============================================================================
# Host Nginx Virtual Host Configuration — Smart-OTP Platform
# Domains: api.miotp.io.vn, cms.miotp.io.vn, docs.miotp.io.vn, out.miotp.io.vn
# Upstream: http://172.18.0.1:18090 (Smart-OTP Internal Gateway)
# ==============================================================================

# ── 1. Partner API Gateway (out.miotp.io.vn) — Dedicated for Partner Service ──
server {
    listen 80;
    listen [::]:80;
    server_name out.miotp.io.vn;

    access_log /var/log/nginx/smart_otp_partner_access.log;
    error_log /var/log/nginx/smart_otp_partner_error.log;

    client_max_body_size 50M;

    # Forward to Partner Service via Smart-OTP Gateway
    location / {
        proxy_pass http://172.18.0.1:18090/smart-otp/api/v1/partner/;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /smart-otp/api/v1/partner/ {
        proxy_pass http://172.18.0.1:18090/smart-otp/api/v1/partner/;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /api/v1/partner/ {
        proxy_pass http://172.18.0.1:18090/smart-otp/api/v1/partner/;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://172.18.0.1:18090/health/partner;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
    }
}

# ── 2. Core API Gateway (api.miotp.io.vn) — Auth & Customer Services ─────────
server {
    listen 80;
    listen [::]:80;
    server_name api.miotp.io.vn;

    access_log /var/log/nginx/smart_otp_api_access.log;
    error_log /var/log/nginx/smart_otp_api_error.log;

    client_max_body_size 50M;

    location / {
        proxy_pass http://172.18.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /api/v1/auth/ {
        proxy_pass http://172.18.0.1:18090/smart-otp/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /api/v1/customer/ {
        proxy_pass http://172.18.0.1:18090/smart-otp/api/v1/customer/;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://172.18.0.1:18090/health/auth;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
    }
}

# ── 3. Web CMS Management Portal (cms.miotp.io.vn) ───────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name cms.miotp.io.vn;

    access_log /var/log/nginx/smart_otp_cms_access.log;
    error_log /var/log/nginx/smart_otp_cms_error.log;

    client_max_body_size 50M;

    location / {
        proxy_pass http://172.18.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 90s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /health {
        proxy_pass http://172.18.0.1:18090/health/cms;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
    }
}


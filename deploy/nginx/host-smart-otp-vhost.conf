# ── 5. Developer Sandbox Portal (sandbox.miotp.io.vn) ─────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name sandbox.miotp.io.vn;

    access_log /var/log/nginx/smart_otp_sandbox_access.log;
    error_log /var/log/nginx/smart_otp_sandbox_error.log;

    client_max_body_size 50M;

    # Forward to Sandbox Portal SPA
    location / {
        proxy_pass http://172.18.0.1:18090/sandbox-portal/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 90s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Forward API requests to CMS backend
    location /api/v1/sandbox/ {
        proxy_pass http://172.18.0.1:18090/cms/api/v1/sandbox/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://172.18.0.1:18090/health/cms;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
    }
}


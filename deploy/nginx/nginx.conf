user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip Configuration
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstreams for Smart-OTP Microservices
    upstream auth-backend {
        server authentication-service:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream customer-backend {
        server customer-service:8082 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream partner-backend {
        server partner-service:8081 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream cms-backend {
        server cms-service:8085 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream cms-admin-portal {
        server cms-admin:80 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream sandbox-portal-service {
        server sandbox-portal:80 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # --- 1. Authentication Service Routing (Core OTP) ---
        location /smart-otp/api/v1/auth/ {
            proxy_pass http://auth-backend/smart-otp/api/v1/auth/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # --- 2. Customer Service Routing ---
        location /smart-otp/api/v1/customer/ {
            proxy_pass http://customer-backend/smart-otp/api/v1/customer/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # --- 3. Partner Service Routing ---
        location /smart-otp/api/v1/partner/ {
            proxy_pass http://partner-backend/smart-otp/api/v1/partner/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # --- 4. CMS Service API Routing ---
        location /cms/ {
            proxy_pass http://cms-backend/cms/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # --- 5. OpenAPI / Swagger UI Routing ---
        location /docs/auth/ {
            proxy_pass http://auth-backend/smart-otp/v3/api-docs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host localhost;
        }

        location /docs/customer/ {
            proxy_pass http://customer-backend/smart-otp/v3/api-docs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host localhost;
        }

        location /docs/partner/ {
            proxy_pass http://partner-backend/smart-otp/v3/api-docs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host localhost;
        }

        location /docs/cms/ {
            proxy_pass http://cms-backend/cms/v3/api-docs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host localhost;
        }

        # --- 6. Health Check Endpoints ---
        location /health/auth {
            proxy_pass http://auth-backend/smart-otp/actuator/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host localhost;
        }

        location /health/customer {
            proxy_pass http://customer-backend/smart-otp/actuator/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host localhost;
        }

        location /health/partner {
            proxy_pass http://partner-backend/smart-otp/actuator/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host localhost;
        }

        location /health/cms {
            proxy_pass http://cms-backend/cms/actuator/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host localhost;
        }

        # --- 7. Prometheus Metrics Scrape Endpoint ---
        location /actuator/prometheus {
            proxy_pass http://auth-backend/smart-otp/actuator/prometheus;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host localhost;
        }

        # --- 8. Developer Sandbox Portal (SPA) ---
        location /sandbox-portal/ {
            proxy_pass http://sandbox-portal-service/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- 9. CMS Admin Web Portal (SPA) ---
        location / {
            proxy_pass http://cms-admin-portal;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

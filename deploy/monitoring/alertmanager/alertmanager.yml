global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'telegram-bot' # Default receiver (placeholder)

receivers:
  - name: 'telegram-bot'
    telegram_configs:
      - bot_token: 'YOUR_TELEGRAM_BOT_TOKEN' # TODO: Replace with real token
        chat_id: -1000000000000 # TODO: Replace with real chat ID
        message: |-
          {{ range .Alerts }}
          🚨 <b>{{ .Annotations.summary }}</b>
          <i>Severity:</i> {{ .Labels.severity }}
          <i>Description:</i> {{ .Annotations.description }}
          <i>Started at:</i> {{ .StartsAt }}
          {{ end }}
        parse_mode: 'HTML'

  - name: 'slack-webhook'
    slack_configs:
      - api_url: 'YOUR_SLACK_WEBHOOK_URL' # TODO: Replace with real webhook
        channel: '#alerts'
        text: >-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          Severity: {{ .Labels.severity }}
          Description: {{ .Annotations.description }}
          {{ end }}

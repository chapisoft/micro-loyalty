<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cyber Dino Runner - Natcash Loyalty Edition</title>
  <script src="../../sdk/gamehub-sdk.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background: #0f172a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: none;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      pointer-events: none;
      z-index: 10;
    }
    .hud-box {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 6px 16px;
      border-radius: 12px;
      text-align: center;
    }
    .hud-label {
      font-size: 10px;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .hud-val {
      font-size: 20px;
      font-weight: 900;
      color: #fbbf24;
    }
    .instructions {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      font-weight: 600;
      pointer-events: none;
      z-index: 10;
      animation: pulse 1.5s infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }
    .game-modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 50;
    }
    .game-modal.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 28px 36px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .modal-title {
      font-size: 26px;
      font-weight: 900;
      color: #fbbf24;
    }
    .modal-score {
      font-size: 16px;
      color: #cbd5e1;
    }
    .btn-action {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #ffffff;
      border: none;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
      margin-top: 8px;
    }
    .btn-action:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="hud">
    <div class="hud-box">
      <div class="hud-label">KỶ LỤC HI</div>
      <div id="high-score" class="hud-val">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">ĐIỂM SỐ</div>
      <div id="score" class="hud-val">0</div>
    </div>
  </div>

  <div class="instructions" id="instructions">
    Chạm màn hình hoặc bấm Phím Cách để nhảy qua chướng ngại vật!
  </div>

  <div class="game-modal" id="modal">
    <div class="modal-box">
      <div class="modal-title">GAME OVER</div>
      <div class="modal-score" id="modal-score-text">Khoảng cách chạy được: 0m</div>
      <button class="btn-action" id="btn-replay">CHẠY LẠI</button>
    </div>
  </div>

  <script>
    if (window.GameHub) {
      GameHub.init({ gameCode: 'DINO_RUNNER' });
    }

    let soundEnabled = true;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playTone(freq, duration, type = 'square') {
      if (!soundEnabled || !audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'SET_SOUND') {
        soundEnabled = e.data.enabled;
      } else if (e.data && e.data.type === 'RESTART_GAME') {
        resetGame();
      }
    });

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const instructions = document.getElementById('instructions');
    const modal = document.getElementById('modal');
    const modalScoreText = document.getElementById('modal-score-text');
    const btnReplay = document.getElementById('btn-replay');

    let width, height, groundY;
    let score = 0;
    let highScore = 0;
    let gameSpeed = 6;
    let gameStarted = false;
    let gameOver = false;
    let particles = [];

    const dino = {
      x: 50,
      y: 0,
      width: 44,
      height: 48,
      vy: 0,
      gravity: 0.6,
      jumpForce: -12.5,
      isGrounded: true,
      legFrame: 0
    };

    let obstacles = [];
    let nextObstacleDistance = 0;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      groundY = height * 0.72;
      dino.y = groundY - dino.height;
    }

    window.addEventListener('resize', resize);
    resize();

    function resetGame() {
      score = 0;
      gameSpeed = 6.5;
      gameOver = false;
      gameStarted = false;
      obstacles = [];
      particles = [];
      nextObstacleDistance = 80;
      dino.y = groundY - dino.height;
      dino.vy = 0;
      dino.isGrounded = true;

      scoreEl.innerText = '0';
      modal.classList.remove('active');
      instructions.style.display = 'block';
    }

    function jump() {
      if (gameOver) return;
      if (!gameStarted) {
        gameStarted = true;
        instructions.style.display = 'none';
      }
      if (dino.isGrounded) {
        dino.vy = dino.jumpForce;
        dino.isGrounded = false;
        playTone(320, 0.12, 'square');
      }
    }

    function spawnObstacle() {
      const type = Math.random() > 0.3 ? 'cactus' : 'drone';
      const isCactus = type === 'cactus';
      obstacles.push({
        type: type,
        x: width + 50,
        y: isCactus ? groundY - 45 : groundY - 85 - Math.random() * 30,
        width: isCactus ? 26 : 36,
        height: isCactus ? 45 : 24,
        passed: false
      });
    }

    function update() {
      if (!gameStarted || gameOver) return;

      // Dino Physics
      dino.vy += dino.gravity;
      dino.y += dino.vy;

      if (dino.y >= groundY - dino.height) {
        dino.y = groundY - dino.height;
        dino.vy = 0;
        dino.isGrounded = true;
      }

      dino.legFrame += 0.2;

      // Score & Speed
      score += 0.15;
      scoreEl.innerText = Math.floor(score);
      gameSpeed = 6.5 + Math.min(6, score * 0.005);

      if (Math.floor(score) > highScore) {
        highScore = Math.floor(score);
        highScoreEl.innerText = highScore;
      }

      if (Math.floor(score) % 100 === 0 && Math.floor(score) > 0) {
        playTone(587, 0.15, 'triangle');
      }

      // Obstacles
      nextObstacleDistance -= gameSpeed * 0.15;
      if (nextObstacleDistance <= 0) {
        spawnObstacle();
        nextObstacleDistance = 60 + Math.random() * 80;
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= gameSpeed;

        // Collision Check (AABB with slight forgiveness)
        const pad = 6;
        if (
          dino.x + pad < obs.x + obs.width - pad &&
          dino.x + dino.width - pad > obs.x + pad &&
          dino.y + pad < obs.y + obs.height - pad &&
          dino.y + dino.height - pad > obs.y + pad
        ) {
          // Hit
          gameOver = true;
          playTone(180, 0.35, 'sawtooth');
          modalScoreText.innerText = `Khoảng cách chạy được: ${Math.floor(score)}m`;
          modal.classList.add('active');

          if (window.GameHub) {
            GameHub.submitScore(Math.floor(score), { highScore });
          }
          if (window.parent) {
            window.parent.postMessage({ type: 'GAME_OVER', score: Math.floor(score) }, '*');
          }
          return;
        }

        if (obs.x < -60) {
          obstacles.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      // Draw Ground
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(width, groundY);
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Ground dash texture
      ctx.strokeStyle = 'rgba(245, 158, 11, 0.3)';
      ctx.lineWidth = 2;
      const offset = (Date.now() * 0.3) % 40;
      for (let x = -offset; x < width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, groundY + 8);
        ctx.lineTo(x + 20, groundY + 8);
        ctx.stroke();
      }

      // Draw Dino (Stylized Natcom Cyber Dino)
      ctx.save();
      ctx.fillStyle = '#fbbf24';
      // Body
      ctx.fillRect(dino.x + 8, dino.y + 12, 28, 24);
      // Head
      ctx.fillRect(dino.x + 22, dino.y, 22, 16);
      // Eye
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(dino.x + 36, dino.y + 4, 4, 4);
      // Cyber Glow Visor
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(dino.x + 32, dino.y + 4, 8, 3);
      // Legs
      ctx.fillStyle = '#fbbf24';
      if (dino.isGrounded) {
        const leg = Math.floor(dino.legFrame) % 2;
        if (leg === 0) {
          ctx.fillRect(dino.x + 12, dino.y + 36, 6, 12);
          ctx.fillRect(dino.x + 24, dino.y + 36, 6, 8);
        } else {
          ctx.fillRect(dino.x + 12, dino.y + 36, 6, 8);
          ctx.fillRect(dino.x + 24, dino.y + 36, 6, 12);
        }
      } else {
        ctx.fillRect(dino.x + 14, dino.y + 36, 6, 6);
        ctx.fillRect(dino.x + 24, dino.y + 36, 6, 6);
      }
      ctx.restore();

      // Draw Obstacles
      for (const obs of obstacles) {
        ctx.save();
        if (obs.type === 'cactus') {
          // Natcom Telecom Tower / Cactus
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(obs.x + 10, obs.y, 6, obs.height);
          ctx.fillRect(obs.x, obs.y + 14, 10, 5);
          ctx.fillRect(obs.x, obs.y + 8, 5, 8);
          ctx.fillRect(obs.x + 16, obs.y + 18, 10, 5);
          ctx.fillRect(obs.x + 21, obs.y + 12, 5, 8);
        } else {
          // Flying Cyber Drone
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(obs.x + 6, obs.y + 6, 24, 12);
          // Wings
          const wing = Math.sin(Date.now() * 0.03) * 6;
          ctx.fillRect(obs.x, obs.y + 4 + wing, 8, 3);
          ctx.fillRect(obs.x + 28, obs.y + 4 + wing, 8, 3);
        }
        ctx.restore();
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // Input handlers
    window.addEventListener('keydown', (e) => {
      if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
        e.preventDefault();
        jump();
      }
    });

    window.addEventListener('pointerdown', (e) => {
      if (e.target && (e.target.id === 'btn-replay' || e.target.closest('#modal'))) return;
      jump();
    });

    btnReplay.addEventListener('click', (e) => {
      e.stopPropagation();
      resetGame();
    });

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>

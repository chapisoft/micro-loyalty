<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lights Out - Natcash Loyalty Edition</title>
  <script src="../../sdk/gamehub-sdk.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background: #0f172a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: none;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 16px;
      z-index: 10;
    }
    .hud-box {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 6px 16px;
      border-radius: 14px;
      text-align: center;
    }
    .hud-label {
      font-size: 10px;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .hud-val {
      font-size: 18px;
      font-weight: 900;
      color: #fbbf24;
    }
    .board-container {
      display: grid;
      gap: 8px;
      padding: 12px;
      background: rgba(30, 41, 59, 0.6);
      border: 2px solid rgba(245, 158, 11, 0.3);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      z-index: 5;
    }
    .cell {
      width: 58px;
      height: 58px;
      border-radius: 12px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .cell.on {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      border-color: #fde68a;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.6), inset 0 0 8px rgba(255, 255, 255, 0.6);
    }
    .cell:active {
      transform: scale(0.92);
    }
    .status-text {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
      pointer-events: none;
      z-index: 10;
    }
    .game-modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 50;
    }
    .game-modal.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 28px 36px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .modal-title {
      font-size: 26px;
      font-weight: 900;
      color: #fbbf24;
    }
    .modal-score {
      font-size: 15px;
      color: #cbd5e1;
    }
    .btn-action {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #ffffff;
      border: none;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
      margin-top: 8px;
    }
    .btn-action:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-box">
      <div class="hud-label">MÀN</div>
      <div id="level-val" class="hud-val">1</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">ĐIỂM SỐ</div>
      <div id="score-val" class="hud-val">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">NƯỚC ĐI</div>
      <div id="moves-val" class="hud-val">0</div>
    </div>
  </div>

  <div class="board-container" id="board"></div>

  <div class="status-text">
    Mục tiêu: Tắt toàn bộ bóng đèn trên bảng mạch!
  </div>

  <div class="game-modal" id="modal">
    <div class="modal-box">
      <div class="modal-title" id="modal-title">🎉 HOÀN THÀNH!</div>
      <div class="modal-score" id="modal-desc">Bạn đã tắt toàn bộ đèn thành công.</div>
      <button class="btn-action" id="btn-next">MÀN TIẾP THEO</button>
    </div>
  </div>

  <script>
    if (window.GameHub) {
      GameHub.init({ gameCode: 'LIGHTS_OUT' });
    }

    let soundEnabled = true;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playTone(freq, duration, type = 'sine') {
      if (!soundEnabled || !audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'SET_SOUND') {
        soundEnabled = e.data.enabled;
      } else if (e.data && e.data.type === 'RESTART_GAME') {
        initLevel(1);
      }
    });

    const boardEl = document.getElementById('board');
    const levelVal = document.getElementById('level-val');
    const scoreVal = document.getElementById('score-val');
    const movesVal = document.getElementById('moves-val');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const btnNext = document.getElementById('btn-next');

    let level = 1;
    let score = 0;
    let moves = 0;
    let gridSize = 4;
    let grid = [];
    let isWon = false;

    function initLevel(lvl) {
      level = lvl;
      levelVal.innerText = level;
      moves = 0;
      movesVal.innerText = moves;
      isWon = false;
      modal.classList.remove('active');

      gridSize = level <= 2 ? 3 : (level <= 5 ? 4 : 5);
      boardEl.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;

      // Initialize all OFF
      grid = [];
      for (let r = 0; r < gridSize; r++) {
        const row = [];
        for (let c = 0; c < gridSize; c++) {
          row.push(false);
        }
        grid.push(row);
      }

      // Guarantee Solvability: Simulate N random clicks on a clear board
      const scrambleSteps = 3 + level * 2;
      for (let i = 0; i < scrambleSteps; i++) {
        const rr = Math.floor(Math.random() * gridSize);
        const cc = Math.floor(Math.random() * gridSize);
        toggleAdjacent(rr, cc, false);
      }

      renderBoard();
    }

    function toggleCell(r, c) {
      if (r >= 0 && r < gridSize && c >= 0 && c < gridSize) {
        grid[r][c] = !grid[r][c];
      }
    }

    function toggleAdjacent(r, c, isPlayer = true) {
      toggleCell(r, c);
      toggleCell(r - 1, c);
      toggleCell(r + 1, c);
      toggleCell(r, c - 1);
      toggleCell(r, c + 1);

      if (isPlayer) {
        moves++;
        movesVal.innerText = moves;
        playTone(400 + (r + c) * 30, 0.08, 'triangle');
        renderBoard();
        checkWin();
      }
    }

    function checkWin() {
      let anyOn = false;
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          if (grid[r][c]) {
            anyOn = true;
            break;
          }
        }
      }

      if (!anyOn && !isWon) {
        isWon = true;
        const gain = Math.max(50, (100 * level) - (moves * 5));
        score += gain;
        scoreVal.innerText = score;
        playTone(523, 0.15, 'sine');
        setTimeout(() => playTone(659, 0.25, 'sine'), 120);

        if (window.parent) {
          window.parent.postMessage({ type: 'GAME_SCORE_UPDATE', score }, '*');
        }

        setTimeout(() => {
          modalTitle.innerText = `🎉 HOÀN THÀNH MÀN ${level}!`;
          modalDesc.innerText = `Số nước đi: ${moves} | Điểm tích lũy: ${score} Điểm`;
          modal.classList.add('active');

          if (window.GameHub) {
            GameHub.submitScore(score, { clearedLevel: level, moves });
          }
        }, 500);
      }
    }

    function renderBoard() {
      boardEl.innerHTML = '';
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          const cell = document.createElement('div');
          cell.className = `cell ${grid[r][c] ? 'on' : ''}`;
          cell.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (!isWon) toggleAdjacent(r, c, true);
          });
          boardEl.appendChild(cell);
        }
      }
    }

    btnNext.addEventListener('click', () => {
      initLevel(level + 1);
    });

    initLevel(1);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tower Stacker - Natcash Loyalty Edition</title>
  <script src="../../sdk/gamehub-sdk.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background: #0f172a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: none;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      max-width: 400px;
      margin: 0 auto;
      z-index: 10;
    }
    .hud-box {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 6px 14px;
      border-radius: 12px;
      text-align: center;
    }
    .hud-label {
      font-size: 9px;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .hud-val {
      font-size: 16px;
      font-weight: 900;
      color: #fbbf24;
    }
    #game-canvas {
      background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%);
      border: 2px solid rgba(245, 158, 11, 0.4);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
      z-index: 5;
    }
    .game-modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 50;
    }
    .game-modal.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 28px 36px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .modal-title {
      font-size: 26px;
      font-weight: 900;
      color: #fbbf24;
    }
    .modal-score {
      font-size: 16px;
      color: #cbd5e1;
    }
    .btn-action {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #ffffff;
      border: none;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-box">
      <div class="hud-label">TẦNG THÁP</div>
      <div id="height-val" class="hud-val">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">ĐIỂM SỐ</div>
      <div id="score-val" class="hud-val">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">COMBO HOÀN HẢO</div>
      <div id="combo-val" class="hud-val">0 🔥</div>
    </div>
  </div>

  <canvas id="game-canvas" width="360" height="520"></canvas>

  <div class="game-modal" id="modal">
    <div class="modal-box">
      <div class="modal-title">THÁP ĐÃ ĐỔ!</div>
      <div class="modal-score" id="modal-score-text">Độ cao đạt được: 0 Tầng</div>
      <button class="btn-action" id="btn-replay">XÂY LẠI THÁP</button>
    </div>
  </div>

  <script>
    if (window.GameHub) {
      GameHub.init({ gameCode: 'TOWER_BLOCKS' });
    }

    let soundEnabled = true;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playNote(freq, duration = 0.15) {
      if (!soundEnabled || !audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const PENTATONIC = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'SET_SOUND') {
        soundEnabled = e.data.enabled;
      } else if (e.data && e.data.type === 'RESTART_GAME') {
        resetGame();
      }
    });

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const heightVal = document.getElementById('height-val');
    const scoreVal = document.getElementById('score-val');
    const comboVal = document.getElementById('combo-val');
    const modal = document.getElementById('modal');
    const modalScoreText = document.getElementById('modal-score-text');
    const btnReplay = document.getElementById('btn-replay');

    const BLOCK_HEIGHT = 26;
    const INITIAL_WIDTH = 180;
    let stack = [];
    let currentBlock = null;
    let fallingBlocks = [];
    let particles = [];
    let score = 0;
    let combo = 0;
    let cameraY = 0;
    let targetCameraY = 0;
    let gameOver = false;

    function getBlockColor(index) {
      const hue = (index * 14 + 35) % 360;
      return `hsl(${hue}, 85%, 55%)`;
    }

    function resetGame() {
      score = 0;
      combo = 0;
      cameraY = 0;
      targetCameraY = 0;
      gameOver = false;
      stack = [];
      fallingBlocks = [];
      particles = [];

      // Base block
      stack.push({
        x: (canvas.width - INITIAL_WIDTH) / 2,
        y: canvas.height - 70,
        width: INITIAL_WIDTH,
        height: BLOCK_HEIGHT,
        color: getBlockColor(0)
      });

      spawnNextBlock();

      scoreVal.innerText = score;
      heightVal.innerText = stack.length - 1;
      comboVal.innerText = `${combo} 🔥`;
      modal.classList.remove('active');
    }

    function spawnNextBlock() {
      const prevBlock = stack[stack.length - 1];
      const speed = Math.min(2.5 + stack.length * 0.12, 6.5);
      const dir = stack.length % 2 === 0 ? 1 : -1;
      const startX = dir === 1 ? -prevBlock.width : canvas.width;

      currentBlock = {
        x: startX,
        y: prevBlock.y - BLOCK_HEIGHT,
        width: prevBlock.width,
        height: BLOCK_HEIGHT,
        vx: dir * speed,
        color: getBlockColor(stack.length)
      };

      targetCameraY = Math.max(0, (stack.length - 8) * BLOCK_HEIGHT);
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 16; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color,
          alpha: 1,
          size: 3 + Math.random() * 3
        });
      }
    }

    function placeBlock() {
      if (gameOver || !currentBlock) return;

      const prev = stack[stack.length - 1];
      const diff = currentBlock.x - prev.x;
      const tolerance = 4; // Perfect placement threshold

      if (Math.abs(diff) <= tolerance) {
        // Perfect Hit!
        currentBlock.x = prev.x;
        combo++;
        score += 100 + combo * 50;
        spawnParticles(currentBlock.x + currentBlock.width / 2, currentBlock.y + BLOCK_HEIGHT / 2, '#fbbf24');
        playNote(PENTATONIC[Math.min(combo, PENTATONIC.length - 1)], 0.25);
      } else if (Math.abs(diff) >= currentBlock.width) {
        // Complete Miss -> Game Over
        fallingBlocks.push({
          x: currentBlock.x,
          y: currentBlock.y,
          width: currentBlock.width,
          height: currentBlock.height,
          vx: currentBlock.vx * 0.5,
          vy: 2,
          rot: 0,
          vrot: (Math.random() - 0.5) * 0.1,
          color: currentBlock.color
        });
        currentBlock = null;
        endGame();
        return;
      } else {
        // Slice block
        combo = 0;
        const newWidth = currentBlock.width - Math.abs(diff);
        let slicedX = 0;
        let slicedWidth = Math.abs(diff);

        if (diff > 0) {
          // Overhang to the right
          slicedX = currentBlock.x + newWidth;
        } else {
          // Overhang to the left
          slicedX = currentBlock.x;
          currentBlock.x = prev.x;
        }

        currentBlock.width = newWidth;
        score += 50;

        // Falling slice
        fallingBlocks.push({
          x: slicedX,
          y: currentBlock.y,
          width: slicedWidth,
          height: currentBlock.height,
          vx: diff > 0 ? 2 : -2,
          vy: 2,
          rot: 0,
          vrot: (Math.random() - 0.5) * 0.1,
          color: currentBlock.color
        });

        playNote(220, 0.1);
      }

      stack.push({
        x: currentBlock.x,
        y: currentBlock.y,
        width: currentBlock.width,
        height: currentBlock.height,
        color: currentBlock.color
      });

      scoreVal.innerText = score;
      heightVal.innerText = stack.length - 1;
      comboVal.innerText = `${combo} 🔥`;

      if (window.parent) {
        window.parent.postMessage({ type: 'GAME_SCORE_UPDATE', score }, '*');
      }

      spawnNextBlock();
    }

    function endGame() {
      gameOver = true;
      modalScoreText.innerText = `Chiều cao đạt được: ${stack.length - 1} Tầng (${score} Điểm)`;
      modal.classList.add('active');

      if (window.GameHub) {
        GameHub.submitScore(score, { height: stack.length - 1 });
      }
      if (window.parent) {
        window.parent.postMessage({ type: 'GAME_OVER', score }, '*');
      }
    }

    // Tap to place
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      placeBlock();
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        placeBlock();
      }
    });

    function update() {
      // Smooth Camera tracking
      cameraY += (targetCameraY - cameraY) * 0.1;

      // Current Block Motion
      if (currentBlock && !gameOver) {
        currentBlock.x += currentBlock.vx;
        if (currentBlock.x < -currentBlock.width || currentBlock.x > canvas.width) {
          currentBlock.vx *= -1;
        }
      }

      // Falling Blocks Physics
      for (let i = fallingBlocks.length - 1; i >= 0; i--) {
        const fb = fallingBlocks[i];
        fb.x += fb.vx;
        fb.y += fb.vy;
        fb.vy += 0.4;
        fb.rot += fb.vrot;

        if (fb.y > canvas.height + cameraY + 100) {
          fallingBlocks.splice(i, 1);
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(0, cameraY);

      // Draw Stack
      stack.forEach((b, idx) => {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.width, b.height);

        // Highlight line
        ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.fillRect(b.x, b.y, b.width, 3);
      });

      // Draw Current Moving Block
      if (currentBlock) {
        ctx.fillStyle = currentBlock.color;
        ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.width, currentBlock.height);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.width, 3);
      }

      // Draw Falling Slices
      fallingBlocks.forEach(fb => {
        ctx.save();
        ctx.translate(fb.x + fb.width / 2, fb.y + fb.height / 2);
        ctx.rotate(fb.rot);
        ctx.fillStyle = fb.color;
        ctx.fillRect(-fb.width / 2, -fb.height / 2, fb.width, fb.height);
        ctx.restore();
      });

      // Draw Particles
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    btnReplay.addEventListener('click', resetGame);

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>

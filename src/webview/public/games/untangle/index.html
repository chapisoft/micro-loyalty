<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Untangle Graph - Natcash Loyalty Edition</title>
  <script src="../../sdk/gamehub-sdk.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background: #0f172a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: none;
      height: 100vh;
      width: 100vw;
    }
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 16px;
      pointer-events: none;
      z-index: 10;
    }
    .hud-box {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 6px 16px;
      border-radius: 14px;
      text-align: center;
    }
    .hud-label {
      font-size: 10px;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .hud-val {
      font-size: 18px;
      font-weight: 900;
      color: #fbbf24;
    }
    .status-banner {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 700;
      pointer-events: none;
      z-index: 10;
    }
    .intersections-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 999px;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #f87171;
    }
    .intersections-badge.solved {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.5);
      color: #34d399;
    }
    .game-modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 50;
    }
    .game-modal.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 28px 36px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .modal-title {
      font-size: 26px;
      font-weight: 900;
      color: #fbbf24;
    }
    .modal-score {
      font-size: 15px;
      color: #cbd5e1;
    }
    .btn-action {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #ffffff;
      border: none;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
      margin-top: 8px;
    }
    .btn-action:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="hud">
    <div class="hud-box">
      <div class="hud-label">MÀN CHƠI</div>
      <div id="level-display" class="hud-val">1</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">ĐIỂM SỐ</div>
      <div id="score-display" class="hud-val">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">ĐIỂM GIAO NHAU</div>
      <div id="intersect-display" class="hud-val" style="color: #ef4444;">0</div>
    </div>
  </div>

  <div class="status-banner">
    <span class="intersections-badge" id="status-badge">Kéo các đỉnh sao cho không có dây nào cắt chéo nhau!</span>
  </div>

  <div class="game-modal" id="modal">
    <div class="modal-box">
      <div class="modal-title" id="modal-title">🎉 HOÀN THÀNH MÀN 1!</div>
      <div class="modal-score" id="modal-desc">Đã gỡ rối thành công toàn bộ dây nối.</div>
      <button class="btn-action" id="btn-next">MÀN TIẾP THEO</button>
    </div>
  </div>

  <script>
    if (window.GameHub) {
      GameHub.init({ gameCode: 'UNTANGLE' });
    }

    let soundEnabled = true;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playTone(freq, duration, type = 'sine') {
      if (!soundEnabled || !audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'SET_SOUND') {
        soundEnabled = e.data.enabled;
      } else if (e.data && e.data.type === 'RESTART_GAME') {
        initLevel(1);
      }
    });

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const levelDisplay = document.getElementById('level-display');
    const scoreDisplay = document.getElementById('score-display');
    const intersectDisplay = document.getElementById('intersect-display');
    const statusBadge = document.getElementById('status-badge');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const btnNext = document.getElementById('btn-next');

    let width, height;
    let nodes = [];
    let edges = [];
    let draggingNode = null;
    let level = 1;
    let score = 0;
    let intersections = 0;
    let solved = false;
    let particles = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      if (nodes.length > 0) render();
    }

    window.addEventListener('resize', resize);
    resize();

    // Line intersection geometry
    function ccw(p1, p2, p3) {
      return (p3.y - p1.y) * (p2.x - p1.x) > (p2.y - p1.y) * (p3.x - p1.x);
    }

    function linesIntersect(p1, p2, p3, p4) {
      // Ignore edges sharing same vertex
      if ((p1.x === p3.x && p1.y === p3.y) || (p1.x === p4.x && p1.y === p4.y) ||
          (p2.x === p3.x && p2.y === p3.y) || (p2.x === p4.x && p2.y === p4.y)) {
        return false;
      }
      return (ccw(p1, p3, p4) !== ccw(p2, p3, p4)) && (ccw(p1, p2, p3) !== ccw(p1, p2, p4));
    }

    function countIntersections() {
      let count = 0;
      for (let i = 0; i < edges.length; i++) {
        edges[i].intersecting = false;
      }
      for (let i = 0; i < edges.length; i++) {
        for (let j = i + 1; j < edges.length; j++) {
          const e1 = edges[i];
          const e2 = edges[j];
          if (linesIntersect(e1.u, e1.v, e2.u, e2.v)) {
            count++;
            e1.intersecting = true;
            e2.intersecting = true;
          }
        }
      }
      return count;
    }

    function initLevel(lvl) {
      level = lvl;
      levelDisplay.innerText = level;
      solved = false;
      modal.classList.remove('active');

      const nodeCount = 4 + level;
      const radius = Math.min(width, height) * 0.35;
      const cx = width / 2;
      const cy = height / 2;

      // 1. Generate planar graph along a circle
      nodes = [];
      for (let i = 0; i < nodeCount; i++) {
        const angle = (i * 2 * Math.PI) / nodeCount;
        nodes.push({
          id: i,
          x: cx + Math.cos(angle) * radius,
          y: cy + Math.sin(angle) * radius,
          radius: 18
        });
      }

      edges = [];
      // Connect outer circle
      for (let i = 0; i < nodeCount; i++) {
        edges.push({ u: nodes[i], v: nodes[(i + 1) % nodeCount], intersecting: false });
      }
      // Add cross non-intersecting chords (Triangulation)
      for (let i = 0; i < Math.floor(nodeCount / 2); i++) {
        const u = i;
        const v = (i + 2) % nodeCount;
        edges.push({ u: nodes[u], v: nodes[v], intersecting: false });
      }

      // 2. Scramble nodes randomly
      const padding = 60;
      nodes.forEach(n => {
        n.x = padding + Math.random() * (width - padding * 2);
        n.y = padding + 60 + Math.random() * (height - padding * 2 - 80);
      });

      updateState();
    }

    function updateState() {
      intersections = countIntersections();
      intersectDisplay.innerText = intersections;

      if (intersections === 0 && !solved) {
        solved = true;
        const gain = 100 * level;
        score += gain;
        scoreDisplay.innerText = score;
        statusBadge.classList.add('solved');
        statusBadge.innerText = '✨ TUYỆT VỜI! TẤT CẢ DÂY NỐI ĐÃ ĐƯỢC GỠ RỐI';
        playTone(523.25, 0.15, 'triangle');
        setTimeout(() => playTone(659.25, 0.3, 'triangle'), 150);

        for (let i = 0; i < 40; i++) {
          particles.push({
            x: width / 2,
            y: height / 2,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            color: `hsl(${Math.random() * 60 + 30}, 100%, 60%)`,
            alpha: 1
          });
        }

        if (window.parent) {
          window.parent.postMessage({ type: 'GAME_SCORE_UPDATE', score }, '*');
        }

        setTimeout(() => {
          modalTitle.innerText = `🎉 HOÀN THÀNH MÀN ${level}!`;
          modalDesc.innerText = `Điểm tích lũy: ${score} Điểm`;
          modal.classList.add('active');

          if (window.GameHub) {
            GameHub.submitScore(score, { clearedLevel: level });
          }
        }, 800);
      } else {
        statusBadge.classList.remove('solved');
        statusBadge.innerText = `Còn ${intersections} điểm giao nhau chưa gỡ`;
      }
    }

    function render() {
      ctx.clearRect(0, 0, width, height);

      // Draw Edges
      for (const e of edges) {
        ctx.beginPath();
        ctx.moveTo(e.u.x, e.u.y);
        ctx.lineTo(e.v.x, e.v.y);
        ctx.lineWidth = e.intersecting ? 3 : 2.5;
        ctx.strokeStyle = e.intersecting ? '#ef4444' : '#10b981';
        ctx.stroke();
      }

      // Draw Nodes
      for (const n of nodes) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
        ctx.fillStyle = n === draggingNode ? '#f59e0b' : '#3b82f6';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
      }

      // Draw Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.02;
        if (p.alpha <= 0) particles.splice(i, 1);
        else {
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      requestAnimationFrame(render);
    }

    // Pointer events for dragging
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function onPointerDown(e) {
      if (solved) return;
      const pos = getPointerPos(e);
      for (const n of nodes) {
        const dist = Math.hypot(n.x - pos.x, n.y - pos.y);
        if (dist <= n.radius + 10) {
          draggingNode = n;
          playTone(440, 0.05, 'sine');
          break;
        }
      }
    }

    function onPointerMove(e) {
      if (!draggingNode) return;
      const pos = getPointerPos(e);
      draggingNode.x = Math.max(30, Math.min(width - 30, pos.x));
      draggingNode.y = Math.max(80, Math.min(height - 80, pos.y));
      updateState();
    }

    function onPointerUp() {
      if (draggingNode) {
        draggingNode = null;
        updateState();
      }
    }

    canvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    canvas.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp, { passive: true });

    btnNext.addEventListener('click', () => {
      initLevel(level + 1);
    });

    initLevel(1);
    requestAnimationFrame(render);
  </script>
</body>
</html>

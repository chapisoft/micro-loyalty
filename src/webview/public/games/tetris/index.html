<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cyber Tetris - Natcash Loyalty Edition</title>
  <script src="../../sdk/gamehub-sdk.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background: #0f172a;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: none;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0 16px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 380px;
      padding: 0 16px;
      z-index: 10;
    }
    .hud-box {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 4px 12px;
      border-radius: 10px;
      text-align: center;
    }
    .hud-label {
      font-size: 9px;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .hud-val {
      font-size: 16px;
      font-weight: 900;
      color: #fbbf24;
    }
    .game-area {
      position: relative;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    #tetris-canvas {
      background: #090d16;
      border: 2px solid rgba(245, 158, 11, 0.4);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #next-canvas {
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 360px;
      padding: 0 16px;
      z-index: 10;
    }
    .btn-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .ctrl-btn {
      flex: 1;
      height: 48px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #ffffff;
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: all 0.1s;
    }
    .ctrl-btn:active {
      transform: scale(0.92);
      background: #f59e0b;
      color: #0f172a;
    }
    .ctrl-btn.rotate-btn {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #ffffff;
      border-color: #fbbf24;
    }
    .game-modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 50;
    }
    .game-modal.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 28px 36px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .modal-title {
      font-size: 26px;
      font-weight: 900;
      color: #fbbf24;
    }
    .modal-score {
      font-size: 16px;
      color: #cbd5e1;
    }
    .btn-action {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #ffffff;
      border: none;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-box">
      <div class="hud-label">ĐIỂM SỐ</div>
      <div id="score-val" class="hud-val">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">HÀNG ĐÃ PHÁ</div>
      <div id="lines-val" class="hud-val">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">CẤP ĐỘ</div>
      <div id="level-val" class="hud-val">1</div>
    </div>
  </div>

  <div class="game-area">
    <canvas id="tetris-canvas" width="200" height="400"></canvas>
    <div class="sidebar">
      <div class="hud-box" style="padding: 4px 8px;">
        <div class="hud-label">TIẾP THEO</div>
      </div>
      <canvas id="next-canvas" width="60" height="60"></canvas>
    </div>
  </div>

  <div class="controls">
    <div class="btn-row">
      <button class="ctrl-btn" id="btn-left">◀</button>
      <button class="ctrl-btn rotate-btn" id="btn-rotate">↻ XOAY</button>
      <button class="ctrl-btn" id="btn-right">▶</button>
    </div>
    <div class="btn-row">
      <button class="ctrl-btn" id="btn-down">▼ THẢ NHẸ</button>
      <button class="ctrl-btn" id="btn-drop">⏬ RƠI NHANH</button>
    </div>
  </div>

  <div class="game-modal" id="modal">
    <div class="modal-box">
      <div class="modal-title">GAME OVER</div>
      <div class="modal-score" id="modal-score-text">Điểm của bạn: 0</div>
      <button class="btn-action" id="btn-replay">CHƠI LẠI</button>
    </div>
  </div>

  <script>
    if (window.GameHub) {
      GameHub.init({ gameCode: 'TETRIS' });
    }

    let soundEnabled = true;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playTone(freq, duration, type = 'sine') {
      if (!soundEnabled || !audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'SET_SOUND') {
        soundEnabled = e.data.enabled;
      } else if (e.data && e.data.type === 'RESTART_GAME') {
        resetGame();
      }
    });

    const canvas = document.getElementById('tetris-canvas');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next-canvas');
    const nextCtx = nextCanvas.getContext('2d');

    const scoreVal = document.getElementById('score-val');
    const linesVal = document.getElementById('lines-val');
    const levelVal = document.getElementById('level-val');
    const modal = document.getElementById('modal');
    const modalScoreText = document.getElementById('modal-score-text');
    const btnReplay = document.getElementById('btn-replay');

    const COLS = 10;
    const ROWS = 20;
    const BLOCK_SIZE = 20;

    const SHAPES = {
      I: { matrix: [[1, 1, 1, 1]], color: '#38bdf8' },
      J: { matrix: [[1, 0, 0], [1, 1, 1]], color: '#3b82f6' },
      L: { matrix: [[0, 0, 1], [1, 1, 1]], color: '#f97316' },
      O: { matrix: [[1, 1], [1, 1]], color: '#fbbf24' },
      S: { matrix: [[0, 1, 1], [1, 1, 0]], color: '#10b981' },
      T: { matrix: [[0, 1, 0], [1, 1, 1]], color: '#a855f7' },
      Z: { matrix: [[1, 1, 0], [0, 1, 1]], color: '#ef4444' }
    };

    const SHAPE_KEYS = Object.keys(SHAPES);

    let grid = createGrid();
    let score = 0;
    let lines = 0;
    let level = 1;
    let gameOver = false;
    let dropCounter = 0;
    let dropInterval = 800;
    let lastTime = 0;

    let currentPiece = null;
    let nextPiece = null;

    function createGrid() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    }

    function getRandomPiece() {
      const type = SHAPE_KEYS[Math.floor(Math.random() * SHAPE_KEYS.length)];
      const def = SHAPES[type];
      return {
        matrix: def.matrix,
        color: def.color,
        x: Math.floor((COLS - def.matrix[0].length) / 2),
        y: 0
      };
    }

    function resetGame() {
      grid = createGrid();
      score = 0;
      lines = 0;
      level = 1;
      gameOver = false;
      dropInterval = 800;
      scoreVal.innerText = score;
      linesVal.innerText = lines;
      levelVal.innerText = level;
      modal.classList.remove('active');

      currentPiece = getRandomPiece();
      nextPiece = getRandomPiece();
      drawNextPiece();
    }

    function collide(grid, piece, offset = { x: 0, y: 0 }) {
      const m = piece.matrix;
      for (let r = 0; r < m.length; r++) {
        for (let c = 0; c < m[r].length; c++) {
          if (m[r][c] !== 0) {
            const newX = piece.x + c + offset.x;
            const newY = piece.y + r + offset.y;
            if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
            if (newY >= 0 && grid[newY][newX] !== 0) return true;
          }
        }
      }
      return false;
    }

    function merge(grid, piece) {
      piece.matrix.forEach((row, r) => {
        row.forEach((val, c) => {
          if (val !== 0) {
            grid[piece.y + r][piece.x + c] = piece.color;
          }
        });
      });
    }

    function rotateMatrix(matrix) {
      const N = matrix.length;
      const M = matrix[0].length;
      const result = Array.from({ length: M }, () => Array(N).fill(0));
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < M; c++) {
          result[c][N - 1 - r] = matrix[r][c];
        }
      }
      return result;
    }

    function rotatePiece() {
      if (gameOver) return;
      const rotated = rotateMatrix(currentPiece.matrix);
      const prevMatrix = currentPiece.matrix;
      currentPiece.matrix = rotated;

      // Wall kick adjustment
      let offset = 0;
      if (collide(grid, currentPiece)) {
        if (!collide(grid, currentPiece, { x: 1, y: 0 })) offset = 1;
        else if (!collide(grid, currentPiece, { x: -1, y: 0 })) offset = -1;
        else {
          currentPiece.matrix = prevMatrix;
          return;
        }
      }
      currentPiece.x += offset;
      playTone(480, 0.05, 'triangle');
    }

    function clearLines() {
      let linesCleared = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r].every(val => val !== 0)) {
          grid.splice(r, 1);
          grid.unshift(Array(COLS).fill(0));
          linesCleared++;
          r++; // check same index again
        }
      }

      if (linesCleared > 0) {
        lines += linesCleared;
        const linePoints = [0, 100, 300, 500, 800];
        score += (linePoints[linesCleared] || 100) * level;
        level = Math.floor(lines / 10) + 1;
        dropInterval = Math.max(150, 800 - (level - 1) * 60);

        scoreVal.innerText = score;
        linesVal.innerText = lines;
        levelVal.innerText = level;

        playTone(linesCleared >= 4 ? 880 : 660, 0.2, 'square');

        if (window.parent) {
          window.parent.postMessage({ type: 'GAME_SCORE_UPDATE', score }, '*');
        }
      }
    }

    function drop() {
      if (gameOver) return;
      if (!collide(grid, currentPiece, { x: 0, y: 1 })) {
        currentPiece.y++;
      } else {
        merge(grid, currentPiece);
        playTone(220, 0.05, 'sawtooth');
        clearLines();

        currentPiece = nextPiece;
        nextPiece = getRandomPiece();
        drawNextPiece();

        if (collide(grid, currentPiece)) {
          gameOver = true;
          playTone(150, 0.4, 'sawtooth');
          modalScoreText.innerText = `Điểm tích lũy: ${score} Điểm`;
          modal.classList.add('active');

          if (window.GameHub) {
            GameHub.submitScore(score, { lines, level });
          }
          if (window.parent) {
            window.parent.postMessage({ type: 'GAME_OVER', score }, '*');
          }
        }
      }
      dropCounter = 0;
    }

    function hardDrop() {
      if (gameOver) return;
      while (!collide(grid, currentPiece, { x: 0, y: 1 })) {
        currentPiece.y++;
        score += 2;
      }
      scoreVal.innerText = score;
      drop();
    }

    function move(dir) {
      if (gameOver) return;
      if (!collide(grid, currentPiece, { x: dir, y: 0 })) {
        currentPiece.x += dir;
        playTone(350, 0.04, 'sine');
      }
    }

    function drawNextPiece() {
      nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
      const m = nextPiece.matrix;
      const size = 12;
      const offX = (nextCanvas.width - m[0].length * size) / 2;
      const offY = (nextCanvas.height - m.length * size) / 2;

      m.forEach((row, r) => {
        row.forEach((val, c) => {
          if (val !== 0) {
            nextCtx.fillStyle = nextPiece.color;
            nextCtx.fillRect(offX + c * size, offY + r * size, size - 1, size - 1);
          }
        });
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Grid background pattern
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += BLOCK_SIZE) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += BLOCK_SIZE) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // Draw Settled Blocks
      grid.forEach((row, r) => {
        row.forEach((val, c) => {
          if (val !== 0) {
            ctx.fillStyle = val;
            ctx.fillRect(c * BLOCK_SIZE, r * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fillRect(c * BLOCK_SIZE, r * BLOCK_SIZE, BLOCK_SIZE - 1, 3);
          }
        });
      });

      // Draw Ghost Piece
      if (currentPiece && !gameOver) {
        let ghostY = currentPiece.y;
        while (!collide(grid, currentPiece, { x: 0, y: ghostY - currentPiece.y + 1 })) {
          ghostY++;
        }
        currentPiece.matrix.forEach((row, r) => {
          row.forEach((val, c) => {
            if (val !== 0) {
              ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
              ctx.strokeRect((currentPiece.x + c) * BLOCK_SIZE + 0.5, (ghostY + r) * BLOCK_SIZE + 0.5, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
            }
          });
        });
      }

      // Draw Current Falling Piece
      if (currentPiece) {
        currentPiece.matrix.forEach((row, r) => {
          row.forEach((val, c) => {
            if (val !== 0) {
              ctx.fillStyle = currentPiece.color;
              ctx.fillRect((currentPiece.x + c) * BLOCK_SIZE, (currentPiece.y + r) * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
              ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
              ctx.fillRect((currentPiece.x + c) * BLOCK_SIZE, (currentPiece.y + r) * BLOCK_SIZE, BLOCK_SIZE - 1, 3);
            }
          });
        });
      }
    }

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;

      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        drop();
      }

      draw();
      requestAnimationFrame(update);
    }

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft') move(-1);
      else if (e.code === 'ArrowRight') move(1);
      else if (e.code === 'ArrowDown') drop();
      else if (e.code === 'ArrowUp' || e.code === 'KeyW') rotatePiece();
      else if (e.code === 'Space') hardDrop();
    });

    // Touch controls
    document.getElementById('btn-left').addEventListener('pointerdown', (e) => { e.preventDefault(); move(-1); });
    document.getElementById('btn-right').addEventListener('pointerdown', (e) => { e.preventDefault(); move(1); });
    document.getElementById('btn-rotate').addEventListener('pointerdown', (e) => { e.preventDefault(); rotatePiece(); });
    document.getElementById('btn-down').addEventListener('pointerdown', (e) => { e.preventDefault(); drop(); });
    document.getElementById('btn-drop').addEventListener('pointerdown', (e) => { e.preventDefault(); hardDrop(); });

    btnReplay.addEventListener('click', resetGame);

    resetGame();
    requestAnimationFrame(update);
  </script>
</body>
</html>

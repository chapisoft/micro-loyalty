# Error Codes
error.success=Transaction réussie
error.tenant_invalid=Code d'abonné invalide ou verrouillé
error.api_key_invalid=Clé API invalide
error.signature_invalid=Signature numérique invalide ou altérée
error.timestamp_drift_exceeded=L'heure de la requête dépasse la dérive autorisée (+-300s)
error.account_not_found=Le profil de membre n'existe pas
error.insufficient_points=Solde de points insuffisant
error.voucher_not_found=Le bon n'existe pas ou a expiré
error.voucher_out_of_stock=Le bon est en rupture de stock
error.transaction_duplicate=Code de transaction déjà existant
error.concurrent_lock_busy=Traitement concurrent en cours, veuillez réessayer
error.partner_unauthorized=Partenaire non autorisé
error.policy_violation=Violation de la politique d'utilisation des points
error.game_out_of_turns=Tours de jeu épuisés pour aujourd'hui
error.unauthorized=Nom d'utilisateur ou mot de passe incorrect
error.system_error=Erreur de traitement interne du système

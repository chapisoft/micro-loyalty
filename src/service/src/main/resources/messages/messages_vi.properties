# Error Codes
error.success=Giao dịch thành công
error.tenant_invalid=Mã thuê bao không hợp lệ hoặc bị khóa
error.api_key_invalid=API Key không hợp lệ
error.signature_invalid=Chữ ký số không hợp lệ hoặc đã bị thay đổi
error.timestamp_drift_exceeded=Thời gian yêu cầu vượt quá dung sai cho phép (+-300s)
error.account_not_found=Hồ sơ hội viên không tồn tại
error.insufficient_points=Số dư điểm không đủ để thực hiện giao dịch
error.voucher_not_found=Phiếu ưu đãi không tồn tại hoặc đã hết hạn
error.voucher_out_of_stock=Phiếu ưu đãi đã hết lượt phát hành
error.transaction_duplicate=Giao dịch đã tồn tại hoặc đã được xử lý trước đó
error.concurrent_lock_busy=Hệ thống đang xử lý giao dịch khác của cùng tài khoản, vui lòng thử lại
error.partner_unauthorized=Đối tác chưa được cấp quyền truy cập hoặc API Key không hợp lệ
error.policy_violation=Giao dịch vi phạm chính sách tích tiêu điểm của đối tác
error.game_out_of_turns=Hết lượt chơi trong ngày, vui lòng hoàn thành nhiệm vụ để nhận thêm lượt
error.unauthorized=Yêu cầu chưa được xác thực danh tính
error.not_found=Không tìm thấy tài nguyên yêu cầu
error.hold_not_found=Không tìm thấy phiên tạm giữ điểm hoặc mã hold không hợp lệ
error.hold_expired=Phiên tạm giữ điểm đã hết hạn, vui lòng thực hiện lại
error.system_error=Hệ thống đang bận, vui lòng thử lại sau ít phút


# Error Codes
error.success=Transaction successful
error.tenant_invalid=Invalid or blocked tenant code
error.api_key_invalid=Invalid API Key
error.signature_invalid=Invalid or tampered digital signature
error.timestamp_drift_exceeded=Request timestamp exceeds allowable drift (+-300s)
error.account_not_found=Member loyalty profile does not exist
error.insufficient_points=Insufficient point balance to perform transaction
error.voucher_not_found=Voucher does not exist or has expired
error.voucher_out_of_stock=Voucher is out of stock
error.transaction_duplicate=Duplicate transaction detected
error.concurrent_lock_busy=Another transaction is currently processing for this account
error.partner_unauthorized=Partner is unauthorized or API Key is invalid
error.policy_violation=Transaction violates partner acceptance policy
error.game_out_of_turns=Daily game turns exhausted
error.unauthorized=Unauthorized access
error.not_found=Resource not found
error.hold_not_found=Payment hold session not found or invalid hold code
error.hold_expired=Payment hold session has expired
error.system_error=Internal system error, please retry later


# Error Codes
error.success=Transaction successful
error.tenant_invalid=Invalid or blocked tenant code
error.api_key_invalid=Invalid API Key
error.signature_invalid=Invalid or tampered digital signature
error.timestamp_drift_exceeded=Request timestamp exceeds allowable drift (+-300s)
error.account_not_found=Member loyalty profile does not exist
error.insufficient_points=Insufficient point balance to perform transaction
error.voucher_not_found=Voucher does not exist or has expired
error.voucher_out_of_stock=Voucher has run out of available quantity
error.transaction_duplicate=Transaction code already exists (Idempotency Duplicate)
error.concurrent_lock_busy=System is processing another transaction for this account, please retry
error.partner_unauthorized=Partner is not authorized to perform this operation
error.policy_violation=Violation of merchant point redemption policy
error.game_out_of_turns=User has used all available game turns for today
error.unauthorized=Invalid username or password
error.system_error=Internal system processing error


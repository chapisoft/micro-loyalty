# Error Codes
error.success=Giao dịch thành công
error.tenant_invalid=Mã thuê bao không hợp lệ hoặc bị khóa
error.api_key_invalid=API Key không hợp lệ
error.signature_invalid=Chữ ký số không hợp lệ hoặc đã bị thay đổi
error.timestamp_drift_exceeded=Thời gian yêu cầu vượt quá dung sai cho phép (+-300s)
error.account_not_found=Hồ sơ hội viên không tồn tại
error.insufficient_points=Số dư điểm không đủ để thực hiện giao dịch
error.voucher_not_found=Phiếu ưu đãi không tồn tại hoặc đã hết hạn
error.voucher_out_of_stock=Phiếu ưu đãi đã hết số lượng khả dụng
error.transaction_duplicate=Mã giao dịch đã tồn tại (Trùng lặp Idempotency)
error.concurrent_lock_busy=Hệ thống đang xử lý một giao dịch khác cho tài khoản này, vui lòng thử lại
error.partner_unauthorized=Đối tác không có quyền thực hiện nghiệp vụ này
error.policy_violation=Vi phạm chính sách chấp nhận tiêu điểm tại điểm bán
error.game_out_of_turns=Người dùng đã hết lượt chơi hôm nay
error.system_error=Lỗi xử lý nội bộ hệ thống


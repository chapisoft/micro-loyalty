<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern gradient background -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00659F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a4b59;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="100" cy="100" r="100" fill="url(#grad1)"/>
  
  <!-- Subtle inner circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
  
  <!-- User avatar - modern minimalist design -->
  <!-- Head -->
  <circle cx="100" cy="65" r="30" fill="#ffffff" opacity="0.95"/>
  
  <!-- Body/Torso -->
  <path d="M 75 95 Q 75 95 75 115 Q 75 130 100 135 Q 125 130 125 115 Q 125 95 125 95" fill="#ffffff" opacity="0.95"/>
  
  <!-- Accent elements for professional look -->
  <!-- Left shoulder accent -->
  <ellipse cx="75" cy="100" rx="8" ry="12" fill="#ffffff" opacity="0.6"/>
  <!-- Right shoulder accent -->
  <ellipse cx="125" cy="100" rx="8" ry="12" fill="#ffffff" opacity="0.6"/>
</svg>